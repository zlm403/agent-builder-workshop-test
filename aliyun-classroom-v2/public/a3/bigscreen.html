<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>共生缸 · 创造道场</title>
<style>
  :root{ --bg:#06080f; --panel:#0c1020cc; --line:#1c2440; --txt:#dfe6ff; --dim:#8a93b8; --gold:#ffcf5b; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; }
  #app{ display:flex; height:100vh; width:100vw; }
  #stage{ position:relative; flex:1; min-width:0; }
  #tank{ display:block; width:100%; height:100%; background:radial-gradient(120% 120% at 30% 20%, #0a0f1f 0%, #05070e 70%); }
  #topbar{ position:absolute; top:12px; left:12px; right:12px; display:flex; gap:10px; align-items:center;
    pointer-events:none; flex-wrap:wrap; }
  #topbar > *{ pointer-events:auto; }
  .pill{ background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 12px;
    font-size:12px; color:var(--dim); backdrop-filter:blur(6px); }
  .pill b{ color:var(--txt); }
  .btn{ background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:999px;
    padding:7px 14px; font-size:13px; cursor:pointer; backdrop-filter:blur(6px); }
  .btn:hover{ border-color:var(--gold); color:var(--gold); }
  .btn.primary{ background:linear-gradient(180deg,#ffd96b,#f0a93a); color:#1a1205; border:none; font-weight:700; }
  .slider{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
  #toast{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%); background:#11182e;
    border:1px solid var(--gold); color:var(--gold); padding:8px 16px; border-radius:10px; font-size:13px;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:5; }
  #tooltip{ position:fixed; pointer-events:none; background:#0b1022ee; border:1px solid var(--line);
    border-radius:8px; padding:6px 9px; font-size:12px; color:var(--txt); display:none; z-index:9; max-width:220px; }
  #tip-name{ color:var(--gold); font-weight:600; }
  #tip-sub{ color:var(--dim); }

  #panel{ width:360px; flex:none; background:linear-gradient(180deg,#0a0e1c,#070a14);
    border-left:1px solid var(--line); display:flex; flex-direction:column; }
  .sec{ padding:14px 16px; border-bottom:1px solid var(--line); }
  .sec h3{ margin:0 0 10px; font-size:13px; letter-spacing:.04em; color:var(--gold); }
  textarea{ width:100%; height:62px; resize:none; background:#070b16; color:var(--txt);
    border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:13px; line-height:1.5; }
  textarea:focus{ outline:none; border-color:var(--gold); }
  .row{ display:flex; gap:8px; margin-top:9px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .chip{ font-size:11px; color:var(--dim); border:1px dashed var(--line); border-radius:999px;
    padding:4px 9px; cursor:pointer; }
  .chip:hover{ color:var(--gold); border-color:var(--gold); }
  .list{ overflow:auto; }
  #creations .item, #traces .item{ background:#070b16; border:1px solid var(--line); border-radius:9px;
    padding:8px 10px; margin-bottom:8px; font-size:12px; }
  #creations .item .t{ color:var(--gold); font-weight:600; }
  #creations .item .d{ color:var(--dim); margin-top:3px; line-height:1.45; }
  #creations .item .s{ color:#7be08a; font-size:11px; margin-top:4px; }
  #creations .item .warn{ color:#ff9b6b; font-size:11px; margin-top:4px; }
  #traces .item .ts{ color:var(--dim); font-size:10px; }
  #traces .item .msg{ margin-top:2px; line-height:1.45; }
  .scroll{ flex:1; overflow:auto; }
  .empty{ color:var(--dim); font-size:12px; padding:4px 2px; }
  .legend{ display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--dim); }
  .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }

  /* 窄屏：纵向堆叠，确保鱼缸不被面板遮挡、可操作 */
  @media (max-width: 760px){
    #app{ flex-direction:column; }
    #stage{ flex:1 1 55%; min-height:0; }
    #panel{ width:100%; flex:1 1 45%; border-left:none; border-top:1px solid var(--line); }
    .sec{ padding:10px 12px; }
    textarea{ height:48px; }
  }
</style>
<style>
#mk-name,#mk-emo{ background:#0c1224; color:#dfe6ff; border:1px solid #243049; border-radius:8px; padding:5px 8px; }
#makeSec label{ display:inline-block; width:34px; color:#8a93b8; font-size:11px; }
#makeSec input[type=range]{ flex:1; }
#mk-tags .chip.active{ background:#5b8cff; color:#fff; border-color:#5b8cff; }
.tbar{ display:inline-flex; gap:6px; align-items:center; padding-left:10px; border-left:1px solid var(--line); }
.t-btn{ padding:5px 10px; font-size:12px; }
.t-btn.warn{ color:#ff8a8a; border-color:#ff8a8a; }
.t-btn:hover{ color:var(--gold); border-color:var(--gold); }
.hint{ margin-top:10px; font-size:11px; color:var(--dim); line-height:1.5; }
.item{ background:#070b16; border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:8px; font-size:12px; }
.item .dot{ margin-right:6px; }
.item .nm{ color:var(--gold); font-weight:600; }
.item .sub{ color:var(--dim); margin-left:8px; font-size:11px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="tank"></canvas>
    <div id="topbar">
      <span class="pill">课堂码 <b>SYM-207</b></span>
      <span class="pill">在线 <b id="h-online">12</b></span>
      <span class="pill">生命 <b id="h-life">0</b></span>
      <span class="pill">资源 <b id="h-res">0</b></span>
      <span class="pill">事件 <b id="h-evt">0</b></span>
      <span class="pill">创造 <b id="h-cre">0</b></span>
      <span class="pill">物体 <b id="h-obj">0</b></span>
      <span class="slider">事件密度 <input id="density" type="range" min="0.3" max="3" step="0.1" value="1" /></span>
      <button class="btn" id="pauseBtn">暂停</button>
      <button class="btn" id="refillBtn">重新充满</button>
      <span class="tbar" title="老师端 · 释放 / 收回">
        <button class="btn t-btn" id="relBtn">释放 1</button>
        <button class="btn t-btn" id="relBtn2">释放多个</button>
        <button class="btn t-btn warn" id="recallBtn">收回全部</button>
      </span>
    </div>
    <div id="toast"></div>
    <div id="tooltip"><div id="tip-name"></div><div id="tip-sub"></div></div>
  </div>

  <aside id="  panel">
    <div class="sec">
      <h3>生命名单 · 谁在世界里</h3>
      <div id="roster" class="list"><div class="empty">还没有生命。老师释放或学生进入后，这里会列出名字。</div></div>
    </div>
    <div class="sec">
      <h3>当前潮流 · 浪潮</h3>
      <div id="trends" class="list"><div class="empty">暂无浪潮。</div></div>
    </div>
    <div class="sec scroll">
      <h3>世界痕迹 · WorldTrace</h3>
      <div id="traces" class="list"><div class="empty">世界还安静着。</div></div>
    </div>
    <div class="sec">
      <div class="legend">
        <span><i class="dot" style="background:#5b8cff"></i>生命体</span>
        <span><i class="dot" style="background:#39d0c8"></i>资源</span>
        <span><i class="dot" style="background:#ffcf5b"></i>稀有资源</span>
        <span><i class="dot" style="background:#ff4d4d"></i>倒霉事件</span>
        <span><i class="dot" style="background:#9fb0c8"></i>基础事件</span>
        <span><i class="dot" style="background:#3a7bff"></i>浪潮/专属事件</span>
        <span><i class="dot" style="background:#ffcf5b"></i>创造物</span>
      </div>
      <div class="hint">老师在顶栏释放/收回演示生命；学员在手机创作端进入自己的生命。</div>
    </div>
  </aside>
</div>

<script>
(function(){
"use strict";

/* ============================ 基础工具 ============================ */
const cv = document.getElementById('tank');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  // 兜底：画布尚未布局（刷新/隐藏标签/窄屏）时退回到窗口尺寸
  if (W < 2){ const pw = (document.getElementById('panel') || {}).offsetWidth || 360; W = Math.max(2, window.innerWidth - pw); }
  if (H < 2){ H = Math.max(2, window.innerHeight); }
  cv.width = Math.max(1, W * DPR); cv.height = Math.max(1, H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

const rand = (a,b)=> a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));
function parseColor(s){
  if (s && s[0] === '#'){ const h = s.slice(1); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  const m = (s || '').match(/\d+/g); return m ? [+m[0], +m[1], +m[2]] : [255,255,255];
}
function blend(h1, h2, t){
  const a = parseColor(h1), b = parseColor(h2), c = a.map((v,i)=> Math.round(v + (b[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function hexA(c, a){ const p = parseColor(c); return `rgba(${p[0]},${p[1]},${p[2]},${a})`; }
const dist = (p,q)=> Math.hypot(p.x - q.x, p.y - q.y);
const now = ()=> performance.now();
let _uid = 0;
const uid = ()=> 'u' + (++_uid).toString(36) + Math.floor(Math.random()*1e4).toString(36);

/* ============================ 世界状态 ============================ */
const world = {
  lives: [], resources: [], events: [], creations: [], targets: [], objects: [],
  traces: [], recognitions: [], floats: [], waves: [], fx: []   // fx：行为粒子流（太阳风/火焰）有界池
};
// 固定属性池：保证“一方面强，另一方面必弱”的公平约束（固定7项总和恒为 TOTAL_ATTR）
// 创造者/生命体还可在 def.custom 里定义附加特质（如 calm/wonder/tenacity 等），
// 这些自定义维度不参与固定公平池，仅作角色个性补充，可被反应/规则读取。
const ATTR_KEYS = ['brave','power','agility','perception','caution','social','luck'];
const TOTAL_ATTR = 100;
world.climate = { era:'neutral', color:null }; // 气候/底色（浪潮系统接入后生效）
world.tempo = 1; world.tempoTarget = 1;        // 世界节奏：快慢（浪潮会临时改变）
let paused = false;
let eventDensity = 1;
let brightness = 1;        // 大屏整体亮度（教师端 postMessage 控制）

/* ============================ 实体工厂 ============================ */
function base(x,y,vx,vy,r,color){
  return { x, y, vx, vy, r, color, trail:[], born: now(), blowUntil: 0 };
}

const LIFE_DEFS = [
  { name:'小蓝', tags:['cautious'],          color:'#5b8cff',
    attrs:{ brave:3, power:5, agility:16, perception:22, caution:34, social:7, luck:13 }, custom:{ calm:20 } },
  { name:'小红', tags:['curious'],           color:'#ffd25b',
    attrs:{ brave:13, power:3, agility:14, perception:34, caution:3, social:18, luck:15 }, custom:{ wonder:24 } },
  { name:'小绿', tags:['stubborn'],          color:'#7be08a',
    attrs:{ brave:20, power:34, agility:13, perception:13, caution:3, social:4, luck:13 }, custom:{ tenacity:28 } },
  { name:'小黄', tags:['social'],            color:'#ffc24b',
    attrs:{ brave:6, power:3, agility:14, perception:17, caution:13, social:34, luck:13 }, custom:{ warmth:26 } },
  { name:'小紫', tags:['cautious','social'], color:'#b06bff',
    attrs:{ brave:3, power:3, agility:14, perception:17, caution:25, social:25, luck:13 }, custom:{ guard:22 } },
  { name:'小青', tags:['curious','social'],  color:'#5be0d0',
    attrs:{ brave:12, power:3, agility:14, perception:31, caution:3, social:24, luck:13 }, custom:{ spark:25 } },
];
function hexToHue(hex){
  const m = (hex||'#ffffff').replace('#','');
  const r = parseInt(m.substr(0,2),16)/255, g = parseInt(m.substr(2,2),16)/255, b = parseInt(m.substr(4,2),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min; let h = 0;
  if (d){ if (max===r) h = ((g-b)/d)%6; else if (max===g) h = (b-r)/d+2; else h = (r-g)/d+4; h *= 60; if (h<0) h += 360; }
  return h;
}

function makeLife(def){
  const x = rand(60, W-60), y = rand(60, H-60), a = rand(0, Math.PI*2), s = rand(.4, 1), R = rand(9,13);
  // 固定7项必须满足公平约束（总和=TOTAL_ATTR）；自定义特质(def.custom)附加其上，不参与公平池
  const fixed = Object.assign({}, def.attrs);
  const sum = ATTR_KEYS.reduce((s,k)=> s + (fixed[k]||0), 0);
  if (sum !== TOTAL_ATTR) console.warn(`[共生缸] ${def.name} 固定属性总和=${sum}，应为 ${TOTAL_ATTR}，不公平`);
  return Object.assign(base(x,y, Math.cos(a)*s, Math.sin(a)*s, R, def.color), {
    type:'life', id:'life_'+uid(), name:def.name, tags:def.tags,
    attrs: Object.assign(fixed, def.custom || {}),
    energy:100, state:'wandering', currentInterest:null, memories:[], relationships:[],
    reactUntil:0, lastCol:{}, hitCount:0, sense:150,
    flash:0, flashColor:'#fff', pulse:0, alert:0, tint:null, tintAmt:0,
    waveAlert:0, waveAlertColor:null, waveThreat:null, waveFront:null, lastWaveReact:0,
    hue: hexToHue(def.color),
    rot: Math.random()*Math.PI*2, rotSpeed:(Math.random()-.5)*0.004, scale:1,
    // 粒子团：照搬“正式课鱼缸”的做法——生命体是一团小粒子，绕中心按角度/半径分布
    particles: (()=>{ const n = Math.round(45 + (def.attrs.power||0)*1.3), arr = [];
      for (let i=0;i<n;i++){ const pa = Math.random()*Math.PI*2, pr = R*1.4 + Math.random()*R*4;
        arr.push({ a:pa, r:pr, x:x+Math.cos(pa)*pr, y:y+Math.sin(pa)*pr, vx:0, vy:0 }); }
      return arr; })(),
    // 行为状态（全部用“成串流动粒子”显形，绝不单粒子微调）
    level:1, exp:0, belly:0, evoT:0,
    emotion:'idle', emoUntil:0, fxT:0, dead:false, deathT:0, _spring:0, emoPref:'dance',
    // 新范式：自由维度（学生自定义命名，总和 100）→ 评分账本；skill=6 个技能定义（学生可覆盖共生缸默认）
    dims: def.dims || Object.assign({}, fixed),
    skill: def.skill || null,
    creator: def.creator || '缸',          // '缸'=共生缸演示生命；否则学员名/学员编码
    studentId: def.studentId || null,
    bornAt: now()
  });
}

/* ============================ 评分经济：降分 + 模糊兜底 ============================ */
// 世界只对生命产生“分数层面”影响；扣哪些维度、表现成啥由学生 skill.反应 定义，
// 没写清就走模糊兜底：优先扣指定维度，其余从最大维度分摊，凑满 N。
function lifeScore(l){
  let s = 0; for (const k in (l.dims||{})) s += (l.dims[k]||0); return s;
}
function applyScoreDrop(l, n){
  const dims = l.dims || (l.dims = {});
  const keys = Object.keys(dims);
  if (!keys.length){ l.energy = Math.max(0, Math.min(100, (l.energy||100) - n)); return; }
  const react = (l.skill && l.skill.反应) ? l.skill.反应 : null;
  let left = n;
  // 1) 学生明确指定优先扣的维度
  if (react && react.dropDims && react.dropDims.length){
    for (const k of react.dropDims){
      if (left <= 0) break;
      const take = Math.min(left, dims[k] || 0);
      dims[k] = Math.max(0, (dims[k]||0) - take);
      left -= take;
    }
  }
  // 2) 模糊兜底：从当前最大维度依次扣（就近/分摊），凑满 n
  while (left > 0.01){
    let mk = null, mv = -1;
    for (const k of keys){ const v = dims[k]||0; if (v > mv){ mv = v; mk = k; } }
    if (mk == null || mv <= 0) break;
    const take = Math.min(left, mv);
    dims[mk] = Math.max(0, dims[mk] - take);
    left -= take;
  }
  l.energy = lifeScore(l);
}

const RES_DEFS = [
  { name:'空闲时间', tags:['time'] },
  { name:'公共空地', tags:['space'] },
  { name:'闲置技能', tags:['skill'] },
  { name:'旧物库存', tags:['material'] },
  { name:'善意余量', tags:['kindness'] },
];
function makeResource(def){
  const x = rand(50, W-50), y = rand(50, H-50), a = rand(0, Math.PI*2), s = rand(.3, .8);
  return Object.assign(base(x,y, Math.cos(a)*s, Math.sin(a)*s, rand(8,11), pick(['#39d0c8','#7fe0a0','#ffd98a'])), {
    type:'resource', id:'res_'+uid(), name:def.name, tags:def.tags,
    amount:100, status:'available', createdAt:now()
  });
}

const EVENT_DEFS = [
  { type:'drifting_object',    name:'漂流物',   color:'#9fb0c8' },
  { type:'sudden_speed',       name:'骤速',     color:'#ffb347' },
  { type:'light_change',       name:'光变',     color:'#c9a0ff' },
  { type:'weather_change',     name:'天气变',   color:'#8ec5ff' },
  { type:'unexpected_arrival', name:'意外来客', color:'#ff9bd0' },
  { type:'resource_appeared',  name:'资源浮现', color:'#7fe0a0' },
];
function makeEvent(def, opts){
  opts = opts || {};
  const bad = !!opts.bad;
  const x = rand(60, W-60), y = rand(60, H-60), a = rand(0, Math.PI*2);
  const s = bad ? rand(1.4, 2.4) : rand(0.3, 1.8);          // 速度有快有慢
  const r = bad ? rand(22, 32) : rand(12, 26);              // 大小有大有小，至少与生命体相当
  return Object.assign(base(x,y, Math.cos(a)*s, Math.sin(a)*s, r, bad?'#ff4d4d':def.color), {
    type:'event', id:'evt_'+uid(),
    eventType: bad ? 'bad_luck' : def.type,
    name: bad ? '倒霉事件' : def.name,
    tags: bad ? ['bad','fast'] : (def.tags || []),
    createdAt: now(),
    durationMs: bad ? Infinity : rand(8000, 16000),
    status:'active',
    radius: r * 0.9                                    // 碰撞范围随显示大小
  });
}

/* ============================ 面事件 / 浪潮（不可躲避的“潮水事件”） ============================ */
// 浪潮是覆盖全缸的世界事实：从某一边整体翻滚扫过，谁都躲不掉，分三轮累积底色。
// 它改变的是“环境本身”——气候、资源表、点事件形态；生命体只能感知并反应，不能阻止。
// 浪潮档案：每种浪潮 ⇄ 专属「事件 + 资源 + 世界节奏」。
// 这就是“什么样的浪潮，对应什么样的事件和资源”：
//   event     : 浪潮来时一起出现的专属大事件
//   resNames  : 浪潮扫过后在空间里留下的资源名字池
//   deposit   : 资源在空间的形态 —— rareChance 稀有度 / count 疏密 / rRange 大小
//   world     : 世界节奏 —— speed 快慢 / size 大小（让整个世界有快有慢、有大有小）
const WAVE_DEFS = [
  { type:'ai_wave',       name:'AI浪潮',     color:'#4b7bec',
    event:{ name:'算力爆发', color:'#7fa6ff' },
    resNames:['算力','数据','模型','语料'],
    deposit:{ count:9, rareChance:0.30, rRange:[8,16] },
    world:{ speed:1.30, size:1.18 } },
  { type:'internet_wave', name:'互联网浪潮', color:'#2ecc71',
    event:{ name:'流量洪峰', color:'#7be8a0' },
    resNames:['流量','连接','内容','节点'],
    deposit:{ count:11, rareChance:0.20, rRange:[7,14] },
    world:{ speed:1.15, size:1.05 } },
  { type:'reform_wave',   name:'改革浪潮',   color:'#e67e22',
    event:{ name:'红利释放', color:'#ffb86b' },
    resNames:['机会','开放','制度','红利'],
    deposit:{ count:7, rareChance:0.35, rRange:[9,18] },
    world:{ speed:0.85, size:1.22 } },
  { type:'creative_wave', name:'创意浪潮',   color:'#b06bff',
    event:{ name:'灵感迸发', color:'#d3a0ff' },
    resNames:['灵感','点子','审美','好奇心'],
    deposit:{ count:8, rareChance:0.45, rRange:[6,15] },
    world:{ speed:1.05, size:1.00 } },
  { type:'quiet_wave',    name:'极简浪潮',   color:'#6fcfd8',
    event:{ name:'静默时刻', color:'#a8eef2' },
    resNames:['空白','留白','专注','呼吸'],
    deposit:{ count:5, rareChance:0.15, rRange:[5,11] },
    world:{ speed:0.70, size:0.90 } },
];
function makeWave(def){
  const dir = pick(['L','R','T','B']);
  const span = (dir==='L'||dir==='R') ? W : H;
  const baseSpeed = pick([0.0028, 0.004, 0.0055]);
  // 估算整波（三轮）总时长，用来把“疏密”翻译成播种间隔
  const totalMs = (1 / (baseSpeed * 0.4)) * 16.67 * 3;
  return {
    type:'wave', id:'wave_'+uid(), waveType:def.type, name:def.name, color:def.color,
    eraRes:def.resNames, def, dir, progress:0, pass:1, maxPass:3,
    speed: baseSpeed,                                 // 基础速度（update 里整体降为 10%）
    touched:{}, status:'sweeping', startedAt:now(), settleAt:0,
    wallThick: span * rand(0.10, 0.14),               // 基础波带宽度（按轮次再放大）
    curThick: 0,
    lastSeed: now(), seedGap: Math.max(900, totalMs / (def.deposit.count * def.world.speed)),
    seeded: 0, totalDeposit: def.deposit.count
  };
}
// 浪潮专属事件：与浪潮一起出现的大事件（大小/颜色由这股浪潮决定）
function makeWaveEvent(w){
  const d = w.def.event;
  const dir = w.dir;
  const startAt = dir==='L' ? -20 : dir==='R' ? W+20 : (dir==='T' ? -20 : H+20);
  const vx = dir==='L' ?  rand(.8,1.4) : dir==='R' ? -rand(.8,1.4) : rand(-.4,.4);
  const vy = dir==='T' ?  rand(.8,1.4) : dir==='B' ? -rand(.8,1.4) : rand(-.4,.4);
  const x = (dir==='L'||dir==='R') ? startAt : rand(60, W-60);
  const y = (dir==='T'||dir==='B') ? startAt : rand(60, H-60);
  const r = rand(26, 38) * w.def.world.size;          // 浪潮事件：又大又显眼
  return Object.assign(base(x,y, vx, vy, r, d.color), {
    type:'event', id:'evt_'+uid(), eventType:'wave_event', name:d.name,
    tags:['wave', w.waveType, 'big'], createdAt:now(),
    durationMs: rand(14000, 20000), status:'active', radius: r*0.9,
    waveColor: w.color
  });
}
// 浪潮遗留资源：空间上稀有/疏密/大小各不同
function makeWaveDeposit(w, x, y, rare){
  const def = w.def;
  const a = rand(0, Math.PI*2), s = rand(.25, .7) * def.world.speed;
  const [rmin, rmax] = def.deposit.rRange;
  const r = rare ? rand(rmax*0.95, rmax*1.5) : rand(rmin, rmax);
  const col = rare ? blend(def.color, '#ffcf5b', 0.45) : def.color;
  return Object.assign(base(x,y, Math.cos(a)*s, Math.sin(a)*s, r, col), {
    type:'resource', id:'res_'+uid(), name:pick(def.resNames),
    tags:['era', w.waveType, rare?'rare':'common'],
    status:'available', trail:[], createdAt:now(),
    rarity: rare ? 'rare' : 'common', sizeFactor: def.world.size
  });
}
// 新时代专属资源：气候切换后，世界能长出与时代相关的资源
function makeEraResource(w){
  const x = rand(50, W-50), y = rand(50, H-50), a = rand(0, Math.PI*2), s = rand(.3, .8);
  return Object.assign(base(x,y, Math.cos(a)*s, Math.sin(a)*s, rand(9,12), w.color), {
    type:'resource', id:'res_'+uid(), name:pick(w.eraRes), tags:['era', w.waveType],
    status:'available', trail:[], createdAt:now()
  });
}
// 推进所有浪潮：扫掠、伴随专属事件、遗留资源、不可躲避触碰、三轮累积、气候切换
function updateWaves(dt, t){
  // 自动触发：缸内无进行中浪潮且冷却结束后，来一波新浪潮（⇄ 专属事件 + 资源）
  if (!world.waves.some(w => w.status !== 'done')){
    if (!updateWaves._next || t > updateWaves._next){
      const def = pick(WAVE_DEFS);
      const sameAsLast = def.type === (updateWaves._lastType || null);
      const w = makeWave(def);
      world.waves.push(w);
      // 浪潮来 ⇄ 伴随一个专属大事件（事件被这股浪潮决定）
      world.events.push(makeWaveEvent(w));
      // 世界节奏随浪潮切换：有的快、有的慢（整个世界有快有慢）
      world.tempoTarget = def.world.speed;
      // 间隔拉长；同一种类型/颜色间隔再加长，给生命体准备时间
      updateWaves._next = t + (sameAsLast ? rand(60000, 90000) : rand(40000, 65000));
      updateWaves._lastType = def.type;
    }
  } else {
    world.tempoTarget = 1;   // 没有浪潮时，世界节奏缓缓回到平常
  }
  for (const w of world.waves){
    if (w.status === 'done'){ if (t > w.settleAt + 4000) w._remove = true; continue; }
    w.progress += w.speed * dt * 0.4;               // 速度降为原来的 10%，慢到能看清
    // 第一波窄而轻、后续逐轮更宽更重
    w.curThick = w.wallThick * (0.6 + 0.35 * (w.pass - 1));
    const cover = (ent)=>{
      if (w.dir==='L'||w.dir==='R'){ const x = w.progress*W; return Math.abs(ent.x - x) < w.curThick; }
      const y = w.progress*H; return Math.abs(ent.y - y) < w.curThick;
    };
    const tintAmt = 0.12 + 0.06 * (w.pass - 1);      // 轮次越后染色越重
    for (const l of world.lives){
      if (cover(l) && !w.touched[l.id+':'+w.pass]){  // 每一轮只染一次，三轮累积更深
        w.touched[l.id+':'+w.pass] = true;
        reactTo(l, { kind:'wave', source:w, color:w.color, name:w.name, amt:tintAmt }); // 统一反应+随轮加重
      }
    }
    // 浪潮前沿播撒遗留资源：有稀有、有疏密、有大小，留在空间里
    if (w.seeded < w.totalDeposit && t - w.lastSeed > w.seedGap){
      w.lastSeed = t; w.seeded++;
      const rare = Math.random() < w.def.deposit.rareChance;
      const front = (w.dir==='L'||w.dir==='R') ? w.progress*W : w.progress*H;
      let x, y;
      if (w.dir==='L'||w.dir==='R'){ x = front; y = rand(40, H-40); }
      else { x = rand(40, W-40); y = front; }
      world.resources.push(makeWaveDeposit(w, x, y, rare));
    }
    if (w.progress >= 1){
      w.pass += 1; w.progress = 0;
      if (w.pass > w.maxPass){
        // 三轮扫完 → 世界真实切换气候，并重塑资源表（环境本身改变）
        w.status = 'done'; w.settleAt = t;
        world.climate = { era:w.waveType, color:w.color, eraRes:w.eraRes };
        addTrace({ type:'era_shift', waveType:w.waveType,
          description:`《${w.name}》三轮扫过，世界进入${w.name}时代，底色转为${w.color}` });
        floatText(W/2, H/2, `${w.name}时代来临`, w.color);
        for (let i=0;i<w.eraRes.length;i++) world.resources.push(makeEraResource(w));
      }
    }
  }
  world.waves = world.waves.filter(w => !w._remove);
}

function makeTarget(color, label){

    type:'target', id:'tgt_'+uid(), name:label, rainbow:false

/* ============================ 反馈基元 ============================ */
function floatText(x,y,text,color){
  world.floats.push({ x, y, text, color: color || '#fff', ttl: now() + 2600 });
}
function addTrace(t){

function allEntities(){
  return [].concat(world.lives, world.resources, world.events, world.creations, world.targets, world.objects);
}
function findById(id){
