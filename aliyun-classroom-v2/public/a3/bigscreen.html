/* ============================ 运动 / 反弹 / 拖尾 ============================ */
function step(e, dt){
  const boost = now() < e.blowUntil ? 2.4 : 1;
  const tempo = world.tempo || 1;                  // 世界节奏：浪潮会临时让一切变快/变慢
  e.x += e.vx * dt * boost * tempo;
  e.y += e.vy * dt * boost * tempo;
  const pad = e.r + 4;
  if (e.x < pad){ e.x = pad; e.vx = Math.abs(e.vx); }
  if (e.x > W-pad){ e.x = W-pad; e.vx = -Math.abs(e.vx); }
  if (e.y < pad){ e.y = pad; e.vy = Math.abs(e.vy); }
  if (e.y > H-pad){ e.y = H-pad; e.vy = -Math.abs(e.vy); }
  e.trail.push({ x:e.x, y:e.y });
  if (e.trail.length > 14) e.trail.shift();
}

/* ============================ 碰撞系统（运行时只确认事实） ============================ */
function collide(ev, life){
  life.lastCol[ev.id] = now();
  life.hitCount = (life.hitCount || 0) + 1;
  floatText(ev.x, ev.y - 16, `${ev.name}撞到了${life.name}`, '#ff6b6b');
  addTrace({ type:'collision', eventId: ev.id, lifeIds:[life.id],
    description:`${ev.name}撞到了${life.name}（位置 ${Math.round(ev.x)},${Math.round(ev.y)}）` });

  // 多次碰撞 → 改变活动区域（位置真实变化，由运行事实触发）
  if (life.hitCount >= 2){
    life.x = W - life.x; life.y = H - life.y;
    floatText(life.x, life.y - 18, `${life.name}被多次撞击，转移到新区域`, '#ffb347');
    addTrace({ type:'life_reacted', lifeIds:[life.id], description:`${life.name}被多次碰撞，改变活动区域` });
  }

  // 生命体反应（默认由共生缸定义；学生端未来可覆盖）
  reactTo(life, { kind:'collision', source:ev, color:ev.color });

  // 倒霉事件是真实的世界事实：撞到生命体后，会把附近光斑真实吹开（改变其速度/方向）
  if (ev.eventType === 'bad_luck') scatter(ev.x, ev.y, ev.radius + 70, 2.4);

  // 通知所有监听 collision 的 Creation 规则
  for (const c of world.creations)
    for (const r of c.rules)
      if (r.condition.type === 'collision' &&
          (r.condition.targetType === 'life' || r.condition.targetType === ev.eventType))
        triggerCollisionRule(c, r, ev, life);
}

/* ============================ 事件影响附近对象（世界运行时事实） ============================ */
function scatter(x, y, R, speed){
  let pushed = 0;
  for (const e of allEntities()){
    if (e.type === 'event' && e.eventType === 'bad_luck') continue;
    if (dist(e, { x, y }) < R){
      const a = Math.atan2(e.y - y, e.x - x) || rand(0, Math.PI*2);
      e.vx = Math.cos(a) * speed; e.vy = Math.sin(a) * speed;
      e.blowUntil = now() + 1000;
      pushed++;
    }
  }
  if (pushed > 0)
    addTrace({ type:'life_reacted', lifeIds:[], description:`倒霉事件把附近 ${pushed} 个光斑吹开了` });
}

/* ============================ 生命体反应（两种主体可定义） ============================ */
/* 1) 共生缸默认反应：当学生端未定义时生效，保证“碰到就有可见反馈” */
function reactTo(life, stim){
  // 学生端未来覆盖点：if (typeof life.customReact === 'function'){ life.customReact(stim); return; }
  applyWorldReaction(life, stim);
}

function applyWorldReaction(life, stim){
  const a = life.attrs;
  life.flash = now() + 600;                       // 受击闪光（可见反馈）
  life.flashColor = stim.color || '#ff5b6e';
  life.pulse = Math.max(life.pulse || 0, 0.8);    // 缩放脉冲（可见反馈）

  if (stim.kind === 'collision'){
    const ev = stim.source;
    const txt = decidePersonality(life, ev);
    // 属性取舍：固定池之外，强项天然伴随代价 → 公平（基于 100 点制，系数封底不为负）
    let dmg = 8;
    dmg *= (1 + a.brave/100 * 1.5);                 // 越勇敢越可能被吞噬
    dmg *= Math.max(0.2, 1 - a.caution/100 * 0.6);  // 谨慎减伤（封底，不会变负）
    dmg *= (1 + a.perception/100 * 0.6);            // 感知敏锐更敏感
    dmg *= (1 + (Math.random()*2-1)*(a.luck/100));  // 运气波动
    dmg += a.power * 0.12;                           // 武力高 → 被围攻额外损耗
    const drop = Math.round(dmg);
    applyScoreDrop(life, drop);                      // 评分经济：扣维度（模糊兜底），总分随之下降
    const manifest = (life.skill && life.skill.反应 && life.skill.反应.manifest) || txt;
    life.state = 'reacting';
    life.reactUntil = now() + 900;
    addTrace({ type:'life_reacted', lifeIds:[life.id],
      description:`${manifest}（降分-${drop}，总分${lifeScore(life).toFixed(0)}）` });
    floatText(life.x, life.y - 18, manifest, '#ffd25b');
    setEmotion(life, 'cry', 1200);                 // 倒霉：流动泪滴粒子（铁律：成串，非单粒子）
    if (world.fx.length < FX_MAX * 0.9)
      emit(life, 'scatter', { count: 24, hue: life.hue, color:'#ff6b6b' });  // 倒霉炸散飞溅（成束）
    playSkillPrimitive(life, 'hit');                 // 学生「反应」块：按自定义原语播放动作

  } else if (stim.kind === 'resource'){
    const r = stim.source;
    const gain = 8 * Math.max(0.3, 1 - a.caution/100 * 0.6) * (1 + (Math.random()*2-1)*(a.luck/100));
    life.energy = clamp(life.energy + gain, 0, 100);
    life.flashColor = r.color || '#7CFFB0';
    addTrace({ type:'resource_consumed', lifeIds:[life.id],
      description:`${life.name}吸收了${r.name}（慎${a.caution} → 增益${gain.toFixed(1)}）` });
    floatText(life.x, life.y - 18, `吸收${r.name}`, '#7CFFB0');

  } else if (stim.kind === 'wave' || stim.kind === 'climate'){
    // 浪潮/气候触碰：生命体被染上环境底色，并有明显可见反应（闪光+脉冲+随轮加重）
    const amt = stim.amt || 0.12;
    life.tint = stim.color; life.tintAmt = clamp((life.tintAmt||0) + amt, 0, 0.7);
    life.pulse = Math.max(life.pulse || 0, 0.6);
    life.flash = now() + 400; life.flashColor = stim.color;
    addTrace({ type:'life_reacted', lifeIds:[life.id],
      description:`${life.name}感知到${stim.name||'浪潮'}，染上${stim.color}（加深${amt.toFixed(2)}）` });
    floatText(life.x, life.y - 18, `感知到${stim.name||'浪潮'}`, stim.color);
    playSkillPrimitive(life, 'wave');                // 学生「潮流」块：随波/逆流/静止
  }
}

/* ============================ 学生行为原语播放（学生定义 → 大屏兑现） ============================
   视觉词表与学生端 BLOCK_SCHEMA_SYS 一致：学生自由组合，大屏逐个播放到他的身体上。
   全部复用现有能力：setEmotion / emit 粒子 / floatText / _fx 临时缩放·抖动·变暗。 */
function fxApply(l, f){
  l._fx = Object.assign({}, l._fx, f, { t: now(), until: now() + (f.dur || 900) });
}
// 学员自绘草图贴图：有草图返回 img（他的表现用他自己的小模样），没有返回 null（用通用粒子兜底）
function sketchOf(l){
  return (l && l.sketchImg && l.sketchImg.complete && l.sketchImg.naturalWidth) ? l.sketchImg : null;
}
// 学员规定的颜色：spec.color（自由色值，如 "#ff4444" 或 "red" 或 "红色"），没有则用生命自己的色相
function colorOf(l, spec){
  if (!spec || !spec.color) return null;
  const c = String(spec.color).trim();
  if (/^(#[0-9a-fA-F]{3,8}|rgba?\(|hsla?\(|[a-zA-Z]+)$/.test(c)) return c;
  return null;
}
// 中英文颜色词 → 色值（学员口语说"红色的光"，AI 也可能直接给色值，这里兜底中文颜色词）
const CN_COLOR = { 红:'#ff5566', 红色:'#ff5566', 橙:'#ff9f43', 橙色:'#ff9f43', 黄:'#ffd166', 黄色:'#ffd166',
  绿:'#4ade80', 绿色:'#4ade80', 青:'#22d3ee', 青色:'#22d3ee', 蓝:'#60a5fa', 蓝色:'#60a5fa',
  紫:'#a78bfa', 紫色:'#a78bfa', 粉:'#f472b6', 粉色:'#f472b6', 白:'#ffffff', 白色:'#ffffff',
  黑:'#222222', 黑色:'#222222', 金:'#ffd700', 金色:'#ffd700', 银:'#c0c0c0', 银色:'#c0c0c0' };
function resolveColor(l, spec){
  const c = colorOf(l, spec);
  if (c) return c;
  if (spec && spec.color && CN_COLOR[String(spec.color).trim()]) return CN_COLOR[String(spec.color).trim()];
  return null; // 无规定 → 用生命自己的色相（调用处兜底）
}
/* —— SVG 表现播放器（引擎）：AI 生成的自包含 SVG 动画，画到生命头顶 —— */
function sanitizeSvg(input){
  if (typeof input !== 'string') return '';
  let s = input;
  if (s.length > 20000) s = s.slice(0, 20000);
  s = s.replace(/<script[\s\S]*?<\/script>/gi, '');
  s = s.replace(/\son\w+\s*=\s*"[^"]*"/gi, '');
  s = s.replace(/\son\w+\s*=\s*'[^']*'/gi, '');
  s = s.replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, '');
  s = s.replace(/\s(?:href|xlink:href)\s*=\s*["']https?:\/\/[^"']*["']/gi, '');
  s = s.replace(/javascript:/gi, '');
  if (!/<svg[\s>]/i.test(s)) return '';
  if (!/\sxmlns\s*=/.test(s)) s = s.replace(/<svg/i, "<svg xmlns='http://www.w3.org/2000/svg'");
  return s;
}
let _svgLayer = null;
function svgLayer(){
  if (!_svgLayer){
    const host = cv.parentNode || document.body;
    if (host !== document.body && getComputedStyle(host).position === 'static') host.style.position = 'relative';
    _svgLayer = document.createElement('div');
    _svgLayer.id = 'svg-fx-layer';
    _svgLayer.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50;overflow:hidden;';
    host.appendChild(_svgLayer);
  }
  return _svgLayer;
}
function playSvgFx(l, svgStr){
  const clean = sanitizeSvg(svgStr);
  if (!clean) return;
  const wrap = document.createElement('div');
  const size = 240;
  wrap.style.cssText = `position:absolute;left:${l.x}px;top:${l.y}px;width:${size}px;height:${size}px;transform:translate(-50%,-50%);`;
  wrap.innerHTML = clean;
  svgLayer().appendChild(wrap);
  setTimeout(() => { wrap.style.transition='opacity .5s'; wrap.style.opacity=0; setTimeout(()=>wrap.remove(), 550); }, 1500);
}
const SKILL_ACTIONS = {
  shrink: (l, sp)=>{ fxApply(l,{scale:0.62, dur:900}); floatText(l.x, l.y-20, '缩成一团', resolveColor(l,sp)||'#9fb0ff'); },
  jitter: (l, sp)=>{ fxApply(l,{jitter:1, dur:800}); floatText(l.x, l.y-20, '瑟瑟发抖', resolveColor(l,sp)||'#ffb0b0'); },
  dim:    (l, sp)=>{ fxApply(l,{dim:0.75, dur:1100}); floatText(l.x, l.y-20, '变暗了', '#8a9bb5'); },
  bubble: (l, sp)=>{ const sk=sketchOf(l); if(world.fx.length<FX_MAX*0.9) emit(l,'emo',{count:8,hue:l.hue,color:resolveColor(l,sp)||'#8fd8ff',img:sk}); floatText(l.x, l.y-20, '咕噜咕噜…', resolveColor(l,sp)||'#8fd8ff'); },
  cry:    (l, sp)=>{ setEmotion(l,'cry',1300); if(world.fx.length<FX_MAX*0.9) emit(l,'drip',{count:6,hue:l.hue,color:resolveColor(l,sp)||undefined,img:sketchOf(l)}); },
  flash:  (l, sp)=>{ l.flash = now()+450; l.flashColor = resolveColor(l,sp)||'#ffffff'; },
  grow:   (l, sp)=>{ fxApply(l,{scale:1.35, dur:1100}); if(world.fx.length<FX_MAX*0.9) emit(l,'emo',{count:14,hue:l.hue,color:resolveColor(l,sp)||`hsl(${l.hue},90%,72%)`,img:sketchOf(l)}); floatText(l.x, l.y-20, '慢慢长大', resolveColor(l,sp)||'#7CFFB0'); },
  devour: (l, sp)=>{ setEmotion(l,'happy',1400); if(world.fx.length<FX_MAX*0.9) emit(l,'emo',{count:10,hue:l.hue,color:resolveColor(l,sp)||undefined,img:sketchOf(l)}); floatText(l.x, l.y-20, '吃掉它！', resolveColor(l,sp)||'#ffd25b'); },
  glow:   (l, sp)=>{ l.flash=now()+500; l.flashColor = resolveColor(l,sp)||'#fff7c0'; if(world.fx.length<FX_MAX*0.9) emit(l,'coin',{count:10,hue:l.hue,color:resolveColor(l,sp)||'#ffe28a',img:sketchOf(l)}); floatText(l.x, l.y-20, '发光了', resolveColor(l,sp)||'#ffe28a'); },
  dance:  (l, sp)=>{ setEmotion(l,'dance',1500); if(world.fx.length<FX_MAX*0.9) emit(l,'emo',{count:12,hue:l.hue,color:resolveColor(l,sp)||undefined,img:sketchOf(l)}); },
  nuzzle: (l, sp, stim)=>{ setEmotion(l,'happy',1200); if(stim && stim.to && world.fx.length<FX_MAX*0.9) emit(l,'share',{to:stim.to,count:6,hue:l.hue,color:resolveColor(l,sp)||undefined,img:sketchOf(l)}); floatText(l.x, l.y-20, '蹭蹭你', resolveColor(l,sp)||'#ff9ecb'); },
  spit:   (l, sp, stim)=>{ const a = (stim && stim.to) ? Math.atan2(stim.to.y-l.y, stim.to.x-l.x) : Math.random()*Math.PI*2; if(world.fx.length<FX_MAX*0.9) emit(l,'dart',{count:6,hue:l.hue,color:resolveColor(l,sp)||undefined,angle:a,img:sketchOf(l)}); floatText(l.x, l.y-20, '吐个小东西', resolveColor(l,sp)||'#b5ff9e'); },
  orbit:  (l, sp)=>{ l.rotSpeed = (l.rotSpeed||0) + 0.02; floatText(l.x, l.y-20, '绕着转', resolveColor(l,sp)||'#c9b3ff'); },
  avoid:  (l, sp)=>{ const a = Math.random()*Math.PI*2; l.vx=Math.cos(a)*2.2; l.vy=Math.sin(a)*2.2; floatText(l.x, l.y-20, '躲开', '#ff9e9e'); },
  follow: (l, sp)=>{ floatText(l.x, l.y-20, '随波而行', resolveColor(l,sp)||'#8fd8ff'); },
  resist: (l, sp)=>{ floatText(l.x, l.y-20, '逆流而上', resolveColor(l,sp)||'#ffcf5b'); },
  still:  (l, sp)=>{ l.vx=0; l.vy=0; floatText(l.x, l.y-20, '静静观看', '#b5c4d8'); },
  fade:   (l, sp)=>{ if(world.fx.length<FX_MAX*0.9) emit(l,'scatter',{count:24,hue:l.hue,color:resolveColor(l,sp)||`hsl(${l.hue},80%,65%)`,img:sketchOf(l)}); },
  lightLink: (l, sp, stim)=>{ l.lightLink = { x:(stim && stim.to)?stim.to.x:l.x, y:(stim && stim.to)?stim.to.y:l.y, until: now()+700, color: resolveColor(l,sp) || null }; floatText(l.x, l.y-20, '光带连线', resolveColor(l,sp)||'#fff7c0'); },
  emitSelf: (l, sp)=>{ const sk=sketchOf(l); if(world.fx.length<FX_MAX*0.9){ for(let i=0;i<8;i++){ const a=Math.random()*Math.PI*2; emit(l,'emo',{count:1,hue:l.hue,color:resolveColor(l,sp)||undefined,img:sk}); const last=world.fx[world.fx.length-1]; if(last){ last.vx=Math.cos(a)*1.6; last.vy=Math.sin(a)*1.6; } } } floatText(l.x, l.y-20, '撒出小星星', resolveColor(l,sp)||'#ffd8a8'); },
  svg:    (l, sp)=>{ if (sp && sp.svg) playSvgFx(l, sp.svg); },
};
// visuals 项规范化：可能是字符串（旧："lightLink" / "lightLink=红色的光"）或对象（新：{action,color,...}）
function normalizeVisualItem(v){
  if (v && typeof v === 'object'){
    if (v.do === 'svg' && v.svg){ return { action: 'svg', svg: v.svg, color: (v.color!=null)?v.color:undefined }; }
    const a = String(v.action||'').trim(); return { action: a, ...v, color: (v.color!=null)?v.color:(v.style?String(v.style):undefined) };
  }
  const s = String(v||'').trim(); if (!s) return null;
  const eq = s.split('=');
  return { action: (eq[0]||'').trim(), color: (eq[1]||'').trim() || undefined };
}
function playSkillPrimitive(life, kind, stim){
  const s = life.skill; if (!s) return;
  const BLOCK = { meet:'交流', hit:'反应', resource:'资源', wave:'潮流' };
  const block = s[BLOCK[kind]];
  if (!block || !Array.isArray(block.visuals) || !block.visuals.length) return;
  if (kind==='resource'){               // 资源块冷却：同位置资源 2.2s 内只播一次，避免每 tick 重播叠满
    const r = stim && stim.to; if (!r) return;
    life._cd = life._cd || {};
    const key = 'res:' + Math.round(r.x) + '_' + Math.round(r.y);
    if (now() - (life._cd[key] || 0) < 2200) return;
    life._cd[key] = now();
  }
  for (const v of block.visuals){
    const spec = normalizeVisualItem(v); if (!spec) continue;
    const name = spec.action;
    if (SKILL_ACTIONS[name]) SKILL_ACTIONS[name](life, spec, stim);
    else {   // 兜底：AI 自由命名的未知原语也给可见反应（通用闪光 + 原语中文文字 + 规定颜色）
      const cn = (typeof v==='string') ? (v.split('=')[1] || name) : (spec.label || name);
      if (world.fx.length < FX_MAX*0.9) emit(life,'emo',{count:6,hue:life.hue,color:resolveColor(life,spec)||undefined});
      floatText(life.x, life.y-20, '表现：'+cn, resolveColor(life,spec)||'#9fd8ff');
    }
  }
}
// 成长/死亡块单独播（长大/飘散）
function playGrowDeathPrimitive(life, kind){
  const s = life.skill; if (!s || !s.成长 || !Array.isArray(s.成长.visuals)) return;
  for (const v of s.成长.visuals){
    const spec = normalizeVisualItem(v); if (!spec) continue;
    if (kind==='grow' && (spec.action==='grow' || spec.action==='svg')) SKILL_ACTIONS[spec.action](life, spec);
    else if (kind==='death' && (spec.action==='fade' || spec.action==='svg')) SKILL_ACTIONS[spec.action](life, spec);
  }
}

/* 2) 个性移动决策：生命体按自身特征选择移动（不改能量/状态，只改速度方向） */
function decidePersonality(life, ev){
  const away = Math.atan2(life.y - ev.y, life.x - ev.x);
  if (life.tags.includes('cautious')){
    life.vx = Math.cos(away)*2.0; life.vy = Math.sin(away)*2.0; life.blowUntil = now() + 1200;
    return `${life.name}受惊，快速逃开`;
  } else if (life.tags.includes('curious')){
    life.vx *= 0.1; life.vy *= 0.1;
    return `${life.name}停下观察`;
  } else if (life.tags.includes('social')){
    const other = world.lives.find(l => l !== life && dist(l, life) < 220);
    if (other){
      life.relationships.push({ with: other.id, at: Date.now() });
      addRecognition({ creationId:'', actorId: life.id, type:'invited', relatedCreationId: other.id });
      return `${life.name}邀请${other.name}一起`;
    }
    life.vx = Math.cos(away)*1.4; life.vy = Math.sin(away)*1.4;
    return `${life.name}寻找伙伴`;
  } else if (life.tags.includes('stubborn')){
    const a = rand(0, Math.PI*2); life.vx = Math.cos(a); life.vy = Math.sin(a);
    return `${life.name}短暂停顿后继续原路`;
  }
  const a = rand(0, Math.PI*2); life.vx = Math.cos(a)*1.2; life.vy = Math.sin(a)*1.2;
  return `${life.name}改变方向`;
}

/* ============================ 感知层（生命体“看见”事件/气候） ============================ */
function perceive(life){
  const sense = life.sense * (1 + life.attrs.perception/100 * 2); // 感知属性决定感知半径
  let danger = false, near = false;
  let waveThreat = null, waveFront = null;
  for (const ev of world.events){
    if (ev.status !== 'active') continue;
    const d = dist(ev, life);
    if (ev.eventType === 'bad_luck'){
      if (d < sense){ near = true; if (d < sense*0.8) danger = true; }
    } else if (ev.eventType === 'wave_event'){     // 浪潮专属大事件：明显的刺激源
      if (d < sense){ near = true; waveThreat = { x:ev.x, y:ev.y, color:ev.color, d }; }
    } else if (d < sense){ near = true; }
  }
  // 浪潮墙前沿压迫：谁都躲不掉，但近处会被推着走（可见反应）
  for (const w of world.waves){
    if (w.status !== 'sweeping') continue;
    const f = waveFrontInfo(w);
    const dl = (f.axis === 'x' ? life.x : life.y) - f.front;
    const dFront = Math.abs(dl);
    if (dFront < sense && Math.sign(dl) === f.sign){     // 仅“逼近侧”且足够近才感到压迫
      if (!waveFront || dFront < waveFront.d) waveFront = { w, d:dFront, axis:f.axis, sign:f.sign, front:f.front };
    }
  }
  life.waveThreat = waveThreat;
  life.waveFront  = waveFront;
  life.waveAlertColor = waveThreat ? waveThreat.color : (waveFront ? waveFront.w.color : null);
  life.waveAlert  = waveThreat ? now() + 600 : (waveFront ? now() + 400 : 0);
  if (danger) life.alert = now() + 500;          // 红色警示环（危险：倒霉事件）
  if (near && life.state === 'wandering') life.state = 'observing';
}
// 浪潮前沿信息：推进轴、当前前沿坐标、以及“逼近侧”的方向符号
function waveFrontInfo(w){
  if (w.dir === 'L' || w.dir === 'R') return { axis:'x', front: w.progress * W, sign: w.dir === 'L' ? 1 : -1 };
  return { axis:'y', front: w.progress * H, sign: w.dir === 'T' ? 1 : -1 };
}

/* 生命体对浪潮/专属事件的明显反应：趋避 / 聚集 / 被推（状态可见） */
function lifeWaveReact(life, dt){
  // 1) 浪潮专属大事件：按个性决定趋避 / 聚集
  if (life.waveThreat){
    const t = life.waveThreat;
    const a = Math.atan2(t.y - life.y, t.x - life.x);   // 指向事件
    const away = a + Math.PI;                            // 背离事件
    if (life.tags.includes('cautious')){                 // 谨慎者：躲开专属事件
      const sp = 2.4;
      life.vx += (Math.cos(away)*sp - life.vx) * 0.14;
      life.vy += (Math.sin(away)*sp - life.vy) * 0.14;
      life.blowUntil = now() + 700;
      setWaveState(life, 'fleeing', t.color, '躲开浪潮事件');
    } else if (life.tags.includes('curious')){           // 好奇者：凑近着迷、绕着看
      const d = Math.hypot(t.x - life.x, t.y - life.y);
      const sp = d > 55 ? 1.1 : 0.25;
      life.vx += (Math.cos(a)*sp - life.vx) * 0.09;
      life.vy += (Math.sin(a)*sp - life.vy) * 0.09;
      life.flash = now() + 300; life.flashColor = t.color;
      setWaveState(life, 'fascinated', t.color, '着迷于浪潮事件');
    } else if (life.tags.includes('social')){            // 社交者：聚拢，并拉同伴
      const sp = 1.0;
      life.vx += (Math.cos(a)*sp - life.vx) * 0.09;
      life.vy += (Math.sin(a)*sp - life.vy) * 0.09;
      gatherBuddies(life, t.x, t.y, t.color);
      setWaveState(life, 'gathering', t.color, '聚向浪潮事件');
    } else {                                             // 其余（固执等）：停步观察
      life.vx *= 0.94; life.vy *= 0.94;
    }
    return;
  }
  // 2) 浪潮墙前沿：被推着走（整体节奏；谨慎者逃得更猛）
  if (life.waveFront){
    const f = life.waveFront;
    const push = 1.3 + (life.tags.includes('cautious') ? 1.3 : 0.4);
    const v = f.sign * push;
    if (f.axis === 'x') life.vx += (v - life.vx) * 0.10;
    else                life.vy += (v - life.vy) * 0.10;
    life.blowUntil = now() + 500;
    if (life.state !== 'fleeing') setWaveState(life, 'wary', f.w.color, '感知到浪潮逼近');
  }
}
// 限流的状态切换：仅状态变化时触发文字/痕迹，避免刷屏
function setWaveState(life, st, color, msg){
  if (life.state === st) return;
  life.state = st;
  if (now() - (life.lastWaveReact||0) > 2500){
    life.lastWaveReact = now();
    life.flash = now() + 300; life.flashColor = color || '#fff';
    floatText(life.x, life.y - 18, msg, color || '#fff');
    addTrace({ type:'life_reacted', lifeIds:[life.id], description:`${life.name}${msg}` });
  }
}
// 社交者把附近不谨慎的同伴一起拉向浪潮事件（真实关系变化）
function gatherBuddies(life, x, y, color){
  const other = world.lives.find(o => o !== life && !o.tags.includes('cautious') && dist(o, life) < 200);
  if (other && !life.relationships.some(r => r.with === other.id)){
    life.relationships.push({ with: other.id, at: Date.now() });
    const a = Math.atan2(y - other.y, x - other.x);
    other.vx += (Math.cos(a)*0.8 - other.vx) * 0.06;
    other.vy += (Math.sin(a)*0.8 - other.vy) * 0.06;
    other.blowUntil = now() + 400;
  }
}

/* 粒子物理：每帧把每个粒子拉回它的轨道位置（绕生命体中心转动），
   内核稳定(caution) → 弹簧刚度（回位快慢）；敏捷高(agility) → 轨迹抖动；
   受击(pulse) → 整团短暂膨胀（scale）。照搬“正式课鱼缸”的观感。 */
function updateParticles(l){
  const s = l.attrs;
  l.rot += l.rotSpeed;
  l.scale = 1 + (l.pulse || 0) * 0.4 + (l.belly || 0) * 0.5;   // 受击膨胀 + 吞噬鼓胀，随 pulse/belly 衰减回弹
  const k = 0.015 + (s.caution || 0) * 0.0006 + (l._spring || 0) * 0.001;   // 内核稳定 → 弹簧刚度（旋钮可增强弹性）
  const damp = 0.86;
  for (const p of l.particles){
    const tx = l.x + Math.cos(p.a + l.rot) * p.r * l.scale;
    const ty = l.y + Math.sin(p.a + l.rot) * p.r * l.scale;
    p.vx += (tx - p.x) * k; p.vy += (ty - p.y) * k;
    if ((s.agility || 0) > 40){                   // 敏捷高：轨迹乱跳化解冲击
      p.vx += (Math.random()-.5) * (s.agility) * 0.0009;
      p.vy += (Math.random()-.5) * (s.agility) * 0.0009;
    }
    p.vx *= damp; p.vy *= damp; p.x += p.vx; p.y += p.vy;
  }
}

/* ============================ 行为粒子流引擎（太阳风 / 火焰） ============================
   核心铁律：任何行为都用“成串、成堆、持续流动的粒子”显形，绝不单粒子微调。
   world.fx 为统一有界池；update 内接 updateFX；渲染用 drawFX（lighter 叠加发光）。
   持续行为每帧发 3–6 颗成流；离散事件一次爆发 20–60 颗成束，保证肉眼可见。 */
const FX_MAX = 1500;
function emit(src, kind, opts){
  opts = opts || {};
  const baseHue = (opts.hue != null) ? opts.hue : (src.hue != null ? src.hue : 210);
  const n = opts.count || 1;
  const r0 = src.r || 12;
  for (let i=0;i<n;i++){
    let p;
    if (kind === 'suction'){                       // 资源/事件 → 生命 吸流（成串）
      const tx = opts.to.x, ty = opts.to.y;
      const a = Math.atan2(ty - src.y, tx - src.x) + (Math.random()-0.5)*0.5;
      const sp = 2.2 + Math.random()*1.8;
      p = { x:src.x, y:src.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, ttl:((opts.ttl||750)/16.67),
            kind:'suction', color:(opts.color||`hsl(${baseHue},90%,68%)`), size:2.1, grav:0, to:opts.to, r:r0 };
    } else if (kind === 'share'){                  // 生命 → 伙伴 成束授予（飞过去融入）
      const tx = opts.to.x, ty = opts.to.y;
      const a = Math.atan2(ty - src.y, tx - src.x) + (Math.random()-0.5)*0.35;
      const sp = 2.8 + Math.random()*1.6;
      p = { x:src.x, y:src.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, ttl:((opts.ttl||1300)/16.67),
            kind:'share', color:(opts.color||`hsl(${baseHue},95%,70%)`), size:2.4, grav:0, to:opts.to, r:r0 };
    } else if (kind === 'wind'){                   // 太阳风：从生命向外持续抛（成串）
      const a = (opts.angle != null) ? opts.angle : Math.random()*Math.PI*2;
      const sp = (opts.speed||1.7) * (0.5 + Math.random());
      p = { x:src.x+Math.cos(a)*r0*1.5, y:src.y+Math.sin(a)*r0*1.5, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
            life:1, ttl:((opts.ttl||1300)/16.67), kind:'wind', color:(opts.color||`hsla(${baseHue},85%,66%,1)`),
            size:(opts.size||1.9), grav:0, r:r0 };
    } else if (kind === 'coin'){                   // 稀有吞噬：金色金币/星爆（成束）
      const a = Math.random()*Math.PI*2, sp = 2.6 + Math.random()*2.6;
      p = { x:src.x, y:src.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 0.6, life:1, ttl:((opts.ttl||1500)/16.67),
            kind:'coin', color:'#ffcf5b', size:2.8, grav:0.025, r:r0 };
    } else if (kind === 'scatter'){                // 倒霉/死亡炸散（成束）
      const a = Math.random()*Math.PI*2, sp = 3 + Math.random()*3.5;
      p = { x:src.x, y:src.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, ttl:((opts.ttl||1000)/16.67),
            kind:'scatter', color:(opts.color||'#ff6b6b'), size:2.5, grav:0, r:r0 };
    } else if (kind === 'drip'){                   // 哭泣：向下滴落（成串）
      p = { x:src.x+(Math.random()-0.5)*r0, y:src.y+r0*0.4, vx:(Math.random()-0.5)*0.4, vy:0.7+Math.random()*0.9,
            life:1, ttl:((opts.ttl||1300)/16.67), kind:'drip', color:(opts.color||`hsl(${baseHue},75%,72%)`), size:2.1, grav:0.035, r:r0 };
    } else if (kind === 'dart'){                   // 勇气外刺亮镖（成串）
      const a = (opts.angle != null) ? opts.angle : Math.random()*Math.PI*2;
      const sp = 2.2 + Math.random()*1.8;
      p = { x:src.x+Math.cos(a)*r0*1.5, y:src.y+Math.sin(a)*r0*1.5, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
            life:1, ttl:((opts.ttl||750)/16.67), kind:'dart', color:(opts.color||`hsl(${baseHue},95%,74%)`), size:2.7, grav:0, r:r0 };
    } else {                                       // emo / 上浮星点（成串）
      const a = Math.random()*Math.PI*2, sp = 0.6 + Math.random()*1.3;
      p = { x:src.x+(Math.random()-0.5)*r0, y:src.y+(Math.random()-0.5)*r0, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-0.7,
            life:1, ttl:((opts.ttl||1100)/16.67), kind:'emo', color:(opts.color||`hsl(${baseHue},85%,68%)`), size:(opts.size||2.0), grav:0, r:r0 };
    }
    // 学员自绘贴图粒子：opts.img 为 HTMLImageElement 时，粒子用学员草图当贴图播放
    if (opts.img && opts.img.complete && opts.img.naturalWidth){ p.img = opts.img; }
    if (world.fx.length >= FX_MAX) world.fx.shift();
    world.fx.push(p);
  }
}
function updateFX(dt){
  const arr = world.fx;
  for (let i=arr.length-1;i>=0;i--){
    const p = arr[i];
    if ((p.kind === 'suction' || p.kind === 'share') && p.to){      // 朝目标飞：到达即融入
      const dx = p.to.x - p.x, dy = p.to.y - p.y, d = Math.hypot(dx, dy) || 1;
      const sp = Math.hypot(p.vx, p.vy), ns = Math.min(sp + 0.25, 5.5);
      p.vx += (dx/d*ns - p.vx) * 0.14; p.vy += (dy/d*ns - p.vy) * 0.14;
      if (d < (p.to.r || 12) * 0.9){ arr.splice(i, 1); continue; }
    }
    p.vy += p.grav || 0; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.985; p.vy *= 0.985; p.life -= dt / p.ttl;
    if (p.life <= 0) arr.splice(i, 1);
  }
}
function drawFX(){
  ctx.globalCompositeOperation = 'lighter';
  for (const p of world.fx){
    const a = clamp(p.life, 0, 1);
    if (p.img){                                  // 学员草图贴图粒子：画他自己的小模样
      ctx.globalAlpha = a;
      const s = p.size * (p.kind === 'scatter' ? 3.2 : p.kind === 'dart' ? 3.6 : 2.4);
      try { ctx.drawImage(p.img, p.x - s/2, p.y - s/2, s, s); } catch(_) {}
      continue;
    }
    if (p.kind === 'coin'){
      ctx.globalAlpha = a; ctx.fillStyle = '#ffe28a';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*1.5, 0, 7); ctx.fill();
      ctx.strokeStyle = `rgba(255,207,91,${a})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(p.x-p.size*2, p.y); ctx.lineTo(p.x+p.size*2, p.y);
      ctx.moveTo(p.x, p.y-p.size*2); ctx.lineTo(p.x, p.y+p.size*2); ctx.stroke();
    } else if (p.kind === 'dart'){
      ctx.globalAlpha = a; ctx.strokeStyle = p.color; ctx.lineWidth = 2;
      const m = Math.hypot(p.vx, p.vy) || 1, ux = p.vx/m, uy = p.vy/m;
      ctx.beginPath(); ctx.moveTo(p.x - ux*p.size*2, p.y - uy*p.size*2); ctx.lineTo(p.x + ux*p.size*2, p.y + uy*p.size*2); ctx.stroke();
    } else {
      ctx.globalAlpha = a * 0.9; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

/* ============================ 行为模块：吞噬 / 情绪 / 反应 / 连接 / 成长 ============================ */
function setEmotion(l, e, dur){ l.emotion = e; l.emoUntil = now() + (dur || 1600); }

// 太阳风基底：每个生命平静时持续向外甩成串粒子，让整屏始终“涌动”
function lifeSolarWind(l){
  const calm = (l.state === 'idle' || l.state === 'wandering' || l.state === 'observing');
  if (!calm) return;
  l.fxT = (l.fxT || 0) + 1;
  if (l.fxT % 4 !== 0) return;
  if (world.fx.length >= FX_MAX * 0.75) return;
  emit(l, 'wind', { count: 3, hue: l.hue, speed: 1.4 + (l.attrs.power||0)*0.01 });
}

// A 吞噬进化：靠近资源伸触须吸流；吞下鼓胀+溢出亮粒子；稀有爆金币星点+升级
function lifeDevour(l){
  let near = null, nd = 1e9;
  for (const r of world.resources){
    if (r.status !== 'available') continue;
    const d = dist(l, r);
    if (d < 120 && d < nd){ nd = d; near = r; }
  }
  if (!near) return;
  if (world.fx.length < FX_MAX * 0.9){
    emit(near, 'suction', { to:l, count: nd < 40 ? 4 : 2, hue:l.hue, color:`hsl(${l.hue},90%,66%)` });
  }
  l.belly = Math.min(1, (l.belly || 0) + 0.02);    // 临近即微微鼓胀
}
// 资源真正被吞下（热路径 hook）
function onDevour(l, r){
  l.belly = Math.min(1.3, (l.belly || 0) + 0.5);   // 明显鼓胀
  l.exp += 1; setEmotion(l, 'happy', 1400);
  emit(l, 'emo', { count: 10, hue:l.hue, size:2.2, color:`hsl(${l.hue},90%,70%)` });   // 溢出亮粒子成串
  if (r.rarity === 'rare'){                        // 稀有：金色星爆 + 升级闪光
    l.level += 1; l.evoT = now();
    emit(l, 'coin', { count: 34, hue:l.hue });
    l.flash = now() + 500; l.flashColor = '#ffcf5b';
    floatText(l.x, l.y - 20, '✦ 稀有！升级 Lv.' + l.level, '#ffcf5b');
  }
}

// B 事件反应粒子流（在 lifeWaveReact 状态上补充可见流）
function lifeReactFX(l){
  if (world.fx.length >= FX_MAX * 0.9) return;
  l.fxT = (l.fxT || 0) + 1;
  if (l.state === 'fleeing'){ if (l.fxT % 3 === 0) emit(l, 'scatter', { count:2, hue:l.hue, color:`hsl(${l.hue},85%,65%)` }); }
  else if (l.state === 'fascinated'){ if (l.fxT % 3 === 0) emit(l, 'wind', { count:2, hue:l.hue, speed:2.0 }); }
  else if (l.state === 'wary'){ if (Math.random() < 0.1) emit(l, 'emo', { count:1, hue:l.hue, size:1.4 }); }
}

// C 情绪粒子：靠流动粒子显形（跳舞/哭泣/勇气/开心/休眠）
function lifeEmote(l){
  if (l.emotion === 'idle'){
    if (Math.random() < 0.004) setEmotion(l, pick(['dance','happy']), 1800 + Math.random()*1600);
    return;
  }
  if (now() > l.emoUntil){ l.emotion = 'idle'; return; }
  if (world.fx.length >= FX_MAX * 0.92) return;
  l.fxT = (l.fxT || 0) + 1;
  if (l.emotion === 'dance'){ if (l.fxT % 3 === 0) emit(l, 'emo', { count:3, hue:l.hue, angle:l.fxT*0.5 + Math.sin(now()/180)*2, size:2.0, color:`hsl(${l.hue},90%,72%)` }); }
  else if (l.emotion === 'happy'){ emit(l, 'emo', { count:2, hue:l.hue, color:`hsl(${l.hue},90%,72%)` }); }
  else if (l.emotion === 'cry'){ if (Math.random() < 0.5) emit(l, 'drip', { count:2, hue:l.hue }); }
  else if (l.emotion === 'brave'){ if (l.fxT % 3 === 0) emit(l, 'dart', { count:2, hue:l.hue, angle:l.fxT*2.1 }); }
  else if (l.emotion === 'sleep'){ if (Math.random() < 0.2) emit(l, 'emo', { count:1, hue:l.hue, size:1.3, color:`hsl(${l.hue},40%,55%)` }); }
}

// D 连接流光：关系伙伴间持续成束粒子流（看得见的“授予”）；低能伙伴获输能
function lifeConnect(l){
  if (world.fx.length >= FX_MAX * 0.9) return;
  for (const rel of l.relationships){
    const o = findById(rel.with);
    if (!o || o.dead) continue;
    if (dist(l, o) > 160) continue;
    l.fxT = (l.fxT || 0) + 1;
    if (l.fxT % 10 === 0) emit(l, 'share', { to:o, count:3, hue:l.hue });        // 成束授予粒子飞向伙伴
    if (o.energy < 40 && l.fxT % 26 === 0){                                       // 帮助：输能给同伴
      o.energy = clamp(o.energy + 6, 0, 100);
      emit(l, 'share', { to:o, count:5, hue:l.hue, color:`hsl(${Math.floor(l.hue)+30},95%,72%)` });
    }
  }
}

// E 成长生死：吃够经验长大（可见爆裂+尺寸跳变）；能量耗尽飘散轮回
function lifeGrowDie(l){
  if (l.exp >= 8){                                 // 长大：永久多一簇轨道粒子 + 可见爆裂 + 尺寸跳变
    l.exp = 0; l.level += 1; l.evoT = now();
    l.r = Math.min(22, l.r * 1.12);
    const add = Math.min(18, Math.round(8 + l.attrs.power*0.15));
    for (let i=0;i<add;i++){ const pa = Math.random()*Math.PI*2, pr = l.r*1.4 + Math.random()*l.r*4;
      l.particles.push({ a:pa, r:pr, x:l.x+Math.cos(pa)*pr, y:l.y+Math.sin(pa)*pr, vx:0, vy:0 }); }
    if (world.fx.length < FX_MAX * 0.9) emit(l, 'emo', { count: 30, hue:l.hue, size:2.4, color:`hsl(${l.hue},90%,72%)` });
    l.flash = now() + 400; l.flashColor = '#bfffd0';
    floatText(l.x, l.y - 20, '长大！Lv.' + l.level, '#bfffd0');
    playGrowDeathPrimitive(l, 'grow');                 // 学生「成长」块：长大的自定义表现
  }
  if (l.energy <= 0 && !l.dead){                   // 死亡：成片脱附飘散，随后自然补位
    l.dead = true; l.deathT = now();
    if (world.fx.length < FX_MAX * 0.9) emit(l, 'scatter', { count: 40, hue:l.hue, color:`hsl(${l.hue},80%,65%)` });
    floatText(l.x, l.y - 18, l.name + ' 消散了', '#9fb0c8');
    playGrowDeathPrimitive(l, 'death');                // 学生「成长」块：消散的自定义表现
  }
}

// F 学生旋钮：生成自定义粒子生命（固定公平属性池不变，仅调观感/个性）
function makeCustomLife(opts){
  opts = opts || {};
  const hue = (opts.hue != null) ? opts.hue : Math.floor(Math.random()*360);
  const color = opts.color || `hsl(${hue},78%,62%)`;
  const tags = (opts.tags && opts.tags.length) ? opts.tags : ['social'];
  const baseDef = pick(LIFE_DEFS);
  const def = { name: opts.name || '自定义生命', tags, color, attrs: Object.assign({}, baseDef.attrs) };
  const l = makeLife(def);
  l.hue = hue; l.color = color;
  l.r = clamp(opts.sizeK || l.r, 8, 22);
  const dn = Math.round(opts.density || l.particles.length);
  l.particles = [];
  for (let i=0;i<dn;i++){ const pa = Math.random()*Math.PI*2, pr = l.r*1.4 + Math.random()*l.r*4;
    l.particles.push({ a:pa, r:pr, x:l.x+Math.cos(pa)*pr, y:l.y+Math.sin(pa)*pr, vx:0, vy:0 }); }
  l._spring = opts.spring || 0; l.emoPref = opts.emoPref || 'dance';
  if (l.emoPref) setEmotion(l, l.emoPref, 5000);
  return l;
}

/* ============================ 规则运行时：条件评估 ============================ */
function evalCondition(rule, c){
  const cond = rule.condition;
  switch (cond.type){
    case 'life_nearby': {
      const near = world.lives.filter(l => dist(l, c) < (cond.distance || 70));
      return { ok: near.length > 0, lives: near };
    }
    case 'resource_nearby': {
      const near = world.resources.filter(r =>
        r.status === 'available' &&
        dist(r, c) < (cond.distance || 70) &&
        (!cond.tags || cond.tags.some(t => r.tags.includes(t))));
      return { ok: near.length > 0, resources: near };
    }
    case 'event_nearby': {
      const near = world.events.filter(e =>
        dist(e, c) < (cond.distance || 80) &&
        (!cond.eventType || e.eventType === cond.eventType));
      return { ok: near.length > 0, events: near };
    }
    case 'co_presence': {
      const center = rule.targetId ? world.targets.find(t => t.id === rule.targetId) : c;
      if (!center) return { ok:false };
      const near = world.lives.filter(l => dist(l, center) < cond.distance);
      return { ok: near.length >= cond.count, lives: near, center };
    }
    case 'touch': {
      if (cond.target === 'resource'){
        for (const r of world.resources.filter(x => x.status === 'available'))
          for (const l of world.lives)
            if (dist(l, r) < l.r + r.r + 6)
              return { ok:true, lives:[l], resources:[r], center:r };
        return { ok:false };
      }
      const center = rule.targetId ? world.targets.find(t => t.id === rule.targetId) : c;
      const near = world.lives.filter(l => center && dist(l, center) < center.r + l.r + 6);
      return { ok: near.length > 0, lives: near, center };
    }
    case 'collision':
      return { ok:false }; // 事件驱动，由 triggerCollisionRule 处理
    case 'action_repeated': {
      const count = cond.count || 2;
      const lid = Object.keys(c.repeatActors).find(k => c.repeatActors[k] >= count);
      const l = lid ? world.lives.find(x => x.id === lid) : null;
      return { ok: !!lid, lives: l ? [l] : [] };
    }
    case 'random_chance':
      return { ok: Math.random() < (cond.probability || 0.1), lives: [] };
    default:
      return { ok:false };
  }
}

/* ============================ 规则运行时：动作执行（真实状态变化） ============================ */
function spawnDerivedObject(type, at, tags){
  const p = at || { x: rand(80, W-80), y: rand(80, H-80) };
  const a = rand(0, Math.PI*2), s = rand(.4, .9);
  const o = Object.assign(base(p.x, p.y, Math.cos(a)*s, Math.sin(a)*s, rand(8,11), '#9fe0ff'), {
    type:'object', id:'obj_'+uid(), name:type, tags: tags || []
  });
  world.objects.push(o);
  return o;
}

function executeAction(action, c, x){
  const lives = x.lives || [];
  switch (action.type){
    case 'spawn': {
      const at = x.center ? { x:x.center.x, y:x.center.y } : { x:c.x, y:c.y };
      const o = spawnDerivedObject(action.objectType || '新物体', at, action.tags);
      addTrace({ type:'object_spawned', creationId:c.id, lifeIds: lives.map(l=>l.id),
        description:`${c.title} 生成了「${o.name}」` });
      floatText(o.x, o.y - 16, '生成：' + o.name, '#9fe0ff');
      break;
    }
    case 'consume_resource': {
      const r = (x.resources && x.resources[0]) || world.resources.find(res =>
        res.status === 'available' && (!action.tags || action.tags.some(t => res.tags.includes(t))) &&
        dist(res, c) < 140) || null;
      if (r){
        r.status = 'consumed';
        const l = lives[0];
        if (l) l.energy = clamp(l.energy + 10, 0, 100);
        addTrace({ type:'resource_consumed', creationId:c.id, lifeIds: lives.map(z=>z.id),
          description:`${c.title} 消耗了${r.name}` });
        floatText(r.x, r.y - 16, r.name + ' 被消耗', '#7fe0a0');
      }
      break;
    }
    case 'change_color': {
      const t = x.center || c;
      if (action.value === 'rainbow'){
        if (t && !t.rainbow){ t.rainbow = true; floatText(t.x, t.y - 20, '变成了彩虹！', '#fff'); }
      } else if (t){ t.color = action.value; }
      break;
    }
    case 'change_speed': {
      const amt = action.amount || 0.6, R = 160;
      for (const e of allEntities()){
        if (dist(e, c) < R){
          const sp = Math.hypot(e.vx, e.vy) || 1;
          const ns = clamp(sp + amt, 0.2, 3.2);
          e.vx = e.vx / sp * ns; e.vy = e.vy / sp * ns; e.blowUntil = now() + 800;
        }
      }
      break;
    }
    case 'change_direction': {
      const R = 160;
      for (const e of allEntities()){
        if (dist(e, c) < R){
          const a = action.angle != null ? action.angle : rand(0, Math.PI*2);
          const sp = Math.hypot(e.vx, e.vy) || 1;
          e.vx = Math.cos(a)*sp; e.vy = Math.sin(a)*sp; e.blowUntil = now() + 800;
        }
      }
      break;
    }
    case 'blow_away': {
      const p = x.pos || { x:c.x, y:c.y }, R = action.radius || 175;
      for (const e of allEntities()){
        if (dist(e, p) < R){
          const a = Math.atan2(e.y - p.y, e.x - p.x);
          e.vx = Math.cos(a)*2.2; e.vy = Math.sin(a)*2.2; e.blowUntil = now() + 1000;
        }
      }
      floatText(p.x, p.y - 18, '附近光斑被吹走了', '#ff8a5b');
      addTrace({ type:'creation_triggered', creationId:c.id, lifeIds: lives.map(z=>z.id),
        description:`${c.title}：碰撞后，附近光斑被吹走` });
      break;
    }
    case 'move': {
      for (const l of lives){
        if (action.target === 'away'){
          const a = Math.atan2(l.y - c.y, l.x - c.x);
          l.vx = Math.cos(a)*1.5; l.vy = Math.sin(a)*1.5; l.blowUntil = now() + 800;
        }
      }
      break;
    }
    case 'connect': {
      c.connectTo = (x.center && x.center.id) || (lives[0] && lives[0].id) || null;
      floatText(c.x, c.y - 20, '连出一条线', '#9fb0ff');
      addTrace({ type:'creation_triggered', creationId:c.id, lifeIds: lives.map(z=>z.id),
        description:`${c.title} 与对象建立连接` });
      break;
    }
    case 'invite': {
      const l = lives[0];
      if (l){
        const other = world.lives.find(o => o !== l && dist(o, l) < 260);
        if (other){
          l.relationships.push({ with: other.id, at: Date.now() });
          addRecognition({ creationId:c.id, actorId:l.id, type:'invited', relatedCreationId:other.id });
          floatText(l.x, l.y - 18, `${l.name}邀请${other.name}`, '#ff9bd0');
          addTrace({ type:'recognition', creationId:c.id, lifeIds:[l.id, other.id],
            description:`${l.name}邀请${other.name}参与《${c.title}》` });
        }
      }
      break;
    }
    case 'change_life_state': {
      for (const l of lives){ l.state = action.value || 'observing'; }
      break;
    }
    case 'leave_trace': {
      addTrace({ type:'creation_triggered', creationId:c.id, lifeIds: lives.map(z=>z.id),
        description:`${c.title} 被触发（${action.traceType || ''}）` });
      break;
    }
  }
}

/* ============================ 规则运行时：参与记录（noticed/joined/replayed/left/remixed） ============================ */
function recordParticipation(c, lives, desc){
  for (const l of (lives || [])){
    if (!c.seen[l.id]){
      c.seen[l.id] = true;
      addRecognition({ creationId:c.id, actorId:l.id, type:'noticed' });
      addTrace({ type:'recognition', creationId:c.id, lifeIds:[l.id],
        description:`${l.name}发现了《${c.title}》` });
      floatText(c.x, c.y - 20, `${l.name}发现了作品`, '#9fb0ff');
    }
    const n = (c.part[l.id] || 0) + 1;
    c.part[l.id] = n;
    c.repeatActors[l.id] = n;
    if (n === 1){
      addRecognition({ creationId:c.id, actorId:l.id, type:'joined' });
      addTrace({ type:'life_participated', creationId:c.id, lifeIds:[l.id],
        description:`${l.name}参与了《${c.title}》` });
    } else {
      addRecognition({ creationId:c.id, actorId:l.id, type:'replayed' });
      addTrace({ type:'recognition', creationId:c.id, lifeIds:[l.id],
        description:`${l.name}又回来尝试了一次《${c.title}》` });
      floatText(l.x, l.y - 18, `${l.name}再次参与`, '#7be08a');
    }
  }
}

/* ============================ 规则运行入口 ============================ */
function runRule(c, r){
  const t = now();
  if (c.triggered[r.meta] && t < c.triggered[r.meta]) return;
  const res = evalCondition(r, c);
  if (!res.ok) return;
  executeAction(r.action, c, res);
  recordParticipation(c, res.lives, null);
  c.triggered[r.meta] = t + (r.cooldown || 3000);
}
function triggerCollisionRule(c, r, ev, life){
  const t = now();
  if (c.triggered[r.meta] && t < c.triggered[r.meta]) return;
  executeAction(r.action, c, { pos:{ x:ev.x, y:ev.y }, life, event:ev, lives:[life], center:c });
  recordParticipation(c, [life], null);
  c.triggered[r.meta] = t + (r.cooldown || 2500);
}

/* ============================ 生命体 AI（观察/靠近/参与/离开/再次接近） ============================ */
function lifeAI(life, dt){
  if (now() < life.reactUntil) return;
  const cand = allEntities().filter(e => e !== life);
  let best = null, bd = 1e9;
  for (const e of cand){ const d = dist(e, life); if (d < bd){ bd = d; best = e; } }
  const sense = 150 * (1 + life.attrs.perception/100 * 2);
  if (best && bd < sense){
    if (best.type === 'life'){
      // 靠近其他生命体：观察并减速；足够近则建立关系（真实状态变化）
      life.state = 'observing';
      life.vx *= 0.95; life.vy *= 0.95;
      if (bd < 40 && !life.relationships.some(r => r.with === best.id)){
        life.relationships.push({ with: best.id, at: Date.now() });
        playSkillPrimitive(life, 'meet', { to:best });   // 学生「交流」块：相遇时按自定义原语表现
      }
    } else if (best.type === 'creation' || best.type === 'target'){
      if (bd < best.r + 24){ life.state = 'participating'; life.vx *= 0.85; life.vy *= 0.85; }
      else {
        life.state = 'observing';
        const a = Math.atan2(best.y - life.y, best.x - life.x), sp = 0.6;
        life.vx += (Math.cos(a)*sp - life.vx)*0.04;
        life.vy += (Math.sin(a)*sp - life.vy)*0.04;
      }
    } else if (best.type === 'resource'){
      // 靠近资源并接触（接触消耗由运行时判定）
      life.state = 'observing';
      const a = Math.atan2(best.y - life.y, best.x - life.x), sp = 0.6;
      life.vx += (Math.cos(a)*sp - life.vx)*0.05;
      life.vy += (Math.sin(a)*sp - life.vy)*0.05;
    } else if (best.type === 'event'){
      if (best.eventType === 'bad_luck'){ life.state = 'wandering'; } // 躲开倒霉事件
      else {
        life.state = 'observing';
        const a = Math.atan2(best.y - life.y, best.x - life.x), sp = 0.4;
        life.vx += (Math.cos(a)*sp - life.vx)*0.03;
        life.vy += (Math.sin(a)*sp - life.vy)*0.03;
      }
    } else { life.state = 'wandering'; }
  } else { life.state = 'wandering'; }
}

/* ============================ 环境生成（资源/事件） ============================ */
let lastEventSpawn = 0, lastResSpawn = 0;
function ambient(t){
  if (!world.events.some(e => e.eventType === 'bad_luck')) world.events.push(makeEvent(null, { bad:true }));
  if (t - lastEventSpawn > 4000 / eventDensity){
    lastEventSpawn = t;
    if (world.events.length < 6 + eventDensity*2){
      const e = makeEvent(pick(EVENT_DEFS));
      modulateEventByClimate(e);   // 浪潮期间：点事件更快、更大、偏环境色
      world.events.push(e);
    }
  }
  if (t - lastResSpawn > 6000){
    lastResSpawn = t;
    if (world.resources.filter(r => r.status === 'available').length < 6){
      // 新时代：有概率长出时代专属资源（气候改变了世界能长出什么）
      const w = world.climate.era !== 'neutral' ? world.waves.find(x => x.waveType === world.climate.era) : null;
      world.resources.push((w && Math.random() < 0.5) ? makeEraResource(w) : makeResource(pick(RES_DEFS)));
    }
  }
}
// 点事件随大事件（浪潮）变化：这正是“大事件来了，小事件也跟着变”
function modulateEventByClimate(e){
  if (world.climate.era === 'neutral') return;
  e.vx *= 1.4; e.vy *= 1.4;
  e.radius *= 1.25;
  e.color = blend(e.color, world.climate.color, 0.4);
}

/* ============================ 主循环 ============================ */
let last = now();
function update(dt, t){
  world.tempo += (world.tempoTarget - world.tempo) * 0.012;  // 世界节奏平滑过渡（有快有慢）
  ambient(t);
  updateFX(dt);         // 推进行为粒子流（太阳风/火焰）
  updateWaves(dt, t);   // 推进浪潮：扫掠、伴随事件、遗留资源、三轮累积、气候切换
  for (const e of allEntities()) step(e, dt);

  // 碰撞：事件 × 生命体（运行时只确认“谁撞到谁”这一事实）
  for (const ev of world.events){
    if (ev.status !== 'active') continue;
    for (const l of world.lives){
      if (t - (l.lastCol[ev.id] || 0) > 2000 && dist(ev, l) < ev.radius + l.r) collide(ev, l);
    }
  }

  for (const l of world.lives) perceive(l);   // 生命体先感知附近事件/气候
  for (const l of world.lives) lifeAI(l, dt);
  for (const l of world.lives) lifeWaveReact(l, dt);   // 再对浪潮/专属事件做出明显反应
  // 粒子团跟随中心运动 + 行为粒子流（太阳风/吞噬/反应/情绪/连接/成长）
  for (const l of world.lives){
    updateParticles(l);
    if (l.dead) continue;
    lifeSolarWind(l);
    lifeDevour(l);
    lifeReactFX(l);
    lifeEmote(l);
    lifeConnect(l);
    lifeGrowDie(l);
    l.belly = Math.max(0, (l.belly || 0) - 0.01);   // 鼓胀回落
  }

  // 生命体真实接触资源 → 资源状态变化（available → consumed），反应交给框架
  for (const l of world.lives){
    for (const r of world.resources){
      if (r.status === 'available' && dist(l, r) < l.r + r.r + 2){
        r.status = 'consumed';
        reactTo(l, { kind:'resource', source:r, color:r.color });
        onDevour(l, r);
        playSkillPrimitive(l, 'resource', { to:r });   // 学生「资源」块：长大/吃掉/发光/转圈
      }
    }
  }

  // Creation（已有学生作品，本阶段不扩展）：发现/离开/轮询规则
  for (const c of world.creations){
    for (const l of world.lives){
      const d = dist(l, c);
      if (d < c.r + 60){
        if (!c.seen[l.id]){
          c.seen[l.id] = true;
          addRecognition({ creationId:c.id, actorId:l.id, type:'noticed' });
          addTrace({ type:'recognition', creationId:c.id, lifeIds:[l.id],
            description:`${l.name}发现了《${c.title}》` });
          floatText(c.x, c.y - 20, `${l.name}发现了作品`, '#9fb0ff');
        }
        c.near[l.id] = true;
      } else if (c.near[l.id]){
        delete c.near[l.id];
        if ((c.part[l.id] || 0) > 0){
          addRecognition({ creationId:c.id, actorId:l.id, type:'left' });
          addTrace({ type:'recognition', creationId:c.id, lifeIds:[l.id],
            description:`${l.name}离开了《${c.title}》` });
        }
      }
    }
    for (const r of c.rules) if (r.condition.type !== 'collision') runRule(c, r);
  }

  // 事件过期
  for (const ev of world.events){
    if (ev.eventType !== 'bad_luck' && ev.status === 'active' && t - ev.createdAt > ev.durationMs){
      ev.status = 'expired';
      addTrace({ type:'event_started', eventId: ev.id, description:`${ev.name}消散了` });
    }
  }

  // 清理
  world.resources = world.resources.filter(r => r.status !== 'consumed');
  world.events    = world.events.filter(e => e.status !== 'expired');
  world.floats    = world.floats.filter(f => f.ttl > t);

  // 死亡生命移除（空缸开局 + 老师/学生自主释放，不做自动补位）
  world.lives = world.lives.filter(l => !l.dead);
  const MIN_LIVES = 0;
  while (world.lives.length < MIN_LIVES) world.lives.push(makeLife(pick(LIFE_DEFS)));

  // 能量平衡（属性取舍：敏捷消耗快；社交者身旁回能、独处脆弱；脉冲衰减）
  for (const l of world.lives){
    const a = l.attrs;
    let drain = 0.01 + a.agility * 0.0006;
    const near = world.lives.some(o => o !== l && dist(o, l) < 60);
    if (a.social >= 20 && near) drain -= 0.02;
    else if (a.social >= 20 && !near) drain += 0.01;
    if (l.pulse > 0.01) l.pulse *= 0.88; else l.pulse = 0;
    l.energy = clamp(l.energy - drain*dt, 0, 100);
  }

  // 气候染色钩子（浪潮系统接入后，climate.color 被设置时，生命体被染上底色）
  if (world.climate.color){
    for (const l of world.lives){ l.tint = world.climate.color; l.tintAmt = clamp((l.tintAmt||0) + 0.002, 0, 0.5); }
  }
}

function loop(){
  const t = now();
  let dt = (t - last) / 16.67; last = t;
  if (dt > 3) dt = 3;
  try {
    if (!paused) update(dt, t);
    render();
  } catch (err){
    if (!loop._warned){ console.error('共生缸运行异常（已跳过本帧）：', err); loop._warned = true; }
  }
  requestAnimationFrame(loop);
}

/* ============================ 渲染 ============================ */
function render(){
  ctx.clearRect(0, 0, W, H);

  // 气候底色：浪潮结算后世界染上时代底色（很淡，不抢主体）
  if (world.climate.color){
    ctx.fillStyle = world.climate.color; ctx.globalAlpha = 0.06;
    ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  }

  // 浪潮：柔边渐变带 + 翻滚波浪线（避免硬边矩形；有的细、有的慢、有的快）
  for (const w of world.waves) drawWave(w);

  // Creation → 目标 / 连接 连线
  for (const c of world.creations){
    const tp = c.targetId ? world.targets.find(x => x.id === c.targetId) : null;
    if (tp){
      ctx.strokeStyle = 'rgba(255,207,91,.18)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(tp.x, tp.y); ctx.stroke();
    }
    if (c.connectTo){
      const o = findById(c.connectTo);
      if (o){
        ctx.strokeStyle = 'rgba(159,224,255,.4)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(o.x, o.y); ctx.stroke();
      }
    }
  }

  // 生命体之间的空间关系（靠近时显示连线，体现“对象之间的关系”）
  for (const a of world.lives){
    for (const b of world.lives){
      if (b.id <= a.id) continue;
      const d = dist(a, b);
      if (d < 55){
        ctx.strokeStyle = 'rgba(120,140,200,' + (0.22 * (1 - d/55)).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }

  for (const e of allEntities()) drawEntity(e);
  drawFX();                                          // 行为粒子流（太阳风/火焰）发光层

  for (const f of world.floats){
    const a = clamp((f.ttl - now())/2600, 0, 1);
    ctx.globalAlpha = a; ctx.fillStyle = f.color;
    ctx.font = '13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha = 1;
  }
}

function drawEntity(e){
  // —— 事件：照搬“正式课鱼缸”光斑效果（仅视觉，不改逻辑） ——
  if (e.type === 'event'){
    const tn = now();
    let a = 1;
    const age = tn - e.createdAt;
    if (age < 600) a = age / 600;                       // 出生淡入
    if (e.eventType !== 'bad_luck'){                    // 临近消失淡出（倒霉事件不过期则常亮）
      const remain = e.durationMs - age;
      if (remain < 800) a = Math.min(a, Math.max(0, remain / 800));
    }
    a = clamp(a, 0, 1);
    const sz = e.r;
    ctx.globalCompositeOperation = 'lighter';           // 叠加发光：光斑重叠更亮
    for (let i = 0; i < e.trail.length; i++){           // 拖尾光丝
      const t = e.trail[i];
      const al = i / e.trail.length * 0.22 * a;
      ctx.fillStyle = hexA(e.color, al);
      ctx.beginPath(); ctx.arc(t.x, t.y, sz * (i / e.trail.length) * 0.6, 0, 7); ctx.fill();
    }
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, sz*2.4);  // 柔光晕：中心亮、边缘散
    g.addColorStop(0, hexA(blend(e.color, '#ffffff', 0.5), 0.95 * a));
    g.addColorStop(0.4, hexA(e.color, 0.5 * a));
    g.addColorStop(1, hexA(e.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(e.x, e.y, sz*2.4, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    if (e.trail.length){                                // 尾巴标注事件性质（2-3字）
      const tail = e.trail[0];
      ctx.globalAlpha = 0.9 * a;
      ctx.fillStyle = hexA(blend(e.color, '#ffffff', 0.4), 1);
      ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(e.name, tail.x, tail.y);
      ctx.globalAlpha = 1;
    }
    return;
  }

  // —— 生命体：粒子团（照搬“正式课鱼缸”视觉，仅视觉不改逻辑） ——
  if (e.type === 'life'){
    const Rv = e.r * 4;                                   // 粒子云可视半径（环/文字定位）
    const energy = e.energy == null ? 100 : e.energy;
    const sat = 40 + energy * 0.35;                       // 能量 → 颜色饱满度
    const tn = now();
    const flashI = (e.flash && tn < e.flash) ? (e.flash - tn) / 300 : 0;
    const light = 52 + Math.min(28, (e.pulse||0) * 28) + flashI * 15;
    const sketched = !!(e.sketchImg && e.sketchImg.complete && e.sketchImg.naturalWidth);
    if (!sketched){   // 粒子身体仅用于「没画草图的样板生命」；学员自绘生命不裹粒子云
      ctx.globalCompositeOperation = 'lighter';
      for (const p of e.particles){
        const a = Math.min(0.95, 0.42 + Math.min(0.4, (e.pulse||0)*0.5) + flashI*0.3);
        ctx.fillStyle = `hsla(${e.hue},${sat}%,${light}%,${a})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.7, 0, 7); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      const cg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r*1.6);  // 中心微弱核光
      cg.addColorStop(0, `hsla(${e.hue},${sat}%,${Math.min(80,light+10)}%,.5)`);
      cg.addColorStop(1, 'transparent');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(e.x, e.y, e.r*1.6, 0, 7); ctx.fill();
    }
    // 学生自绘草图 = 身体（有草图时把外形画出来，粒子团退为气场；无草图回退纯粒子）
    if (e.sketchImg && e.sketchImg.complete && e.sketchImg.naturalWidth){
      const tn2 = now(), fxx = e._fx || {};
      const fxOn = fxx.t && tn2 < fxx.until;
      const sc  = fxOn && fxx.scale ? fxx.scale : 1;
      const dim = fxOn && fxx.dim ? Math.max(0.25, 1 - fxx.dim) : 1;
      const jx  = (fxOn && fxx.jitter) ? (Math.random()-0.5)*7 : 0;
      const jy  = (fxOn && fxx.jitter) ? (Math.random()-0.5)*7 : 0;
      const sz  = e.r * 4.2 * sc;
      ctx.save();
      ctx.translate(e.x + jx, e.y + jy);
      ctx.rotate(e.rot * 0.25);                      // 跟随身体缓慢自转（粒子气场同向）
      ctx.globalAlpha = clamp(dim, 0, 1);
      ctx.drawImage(e.sketchImg, -sz/2, -sz/2, sz, sz);
      ctx.restore();
    }
    if (e.tintAmt > 0 && e.tint){                         // 被浪潮底色染色时叠一层淡色
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = hexA(e.tint, 0.10 * e.tintAmt);
      ctx.beginPath(); ctx.arc(e.x, e.y, Rv, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    if (!sketched){   // 外圈描边是粒子生命的定位环，学员自绘生命不掺这层
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(e.x, e.y, Rv, 0, 7); ctx.stroke();
    }
    if (e.lightLink && tn < e.lightLink.until){   // 光带连线（AI 原语 lightLink，颜色=学员规定或生命色相）
      const k = 1 - (e.lightLink.until - tn)/700;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.55*(1-k);
      ctx.strokeStyle = e.lightLink.color || `hsla(${e.hue},80%,70%,1)`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.lightLink.x, e.lightLink.y); ctx.stroke();
      ctx.restore();
    }
    if (e.alert && tn < e.alert){                         // 危险红环
      ctx.strokeStyle = 'rgba(255,90,100,.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, Rv + 6, 0, 7); ctx.stroke();
    }
    if (e.waveAlert && tn < e.waveAlert && e.waveAlertColor){   // 浪潮色感知环
      ctx.strokeStyle = hexA(e.waveAlertColor, 0.7); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, Rv + 9, 0, 7); ctx.stroke();
    }
    if (e.flash && tn < e.flash){                          // 受击闪光环
      const k = 1 - (e.flash - tn)/600;
      ctx.globalAlpha = (1 - k) * 0.9; ctx.strokeStyle = e.flashColor || '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, Rv + 4 + k*14, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (e.evoT && tn < e.evoT + 900){                  // 进化光环：长大/升级绽放
      const k = (tn - e.evoT) / 900;
      ctx.globalAlpha = (1 - k) * 0.85; ctx.strokeStyle = '#bfffd0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, Rv + 6 + k*32, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (e.name){
      ctx.fillStyle = 'rgba(255,255,255,.82)'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(e.name, e.x, e.y - Rv - 6);
    }
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.fillText(STATE_LABEL[e.state] || e.state, e.x, e.y - Rv - 19);
    return;
  }

  // —— 其余类型（target/creation/resource）—— 保持原通用渲染 ——
  for (let i = 0; i < e.trail.length; i++){
    const p = e.trail[i], a = i / e.trail.length * 0.5;
    ctx.globalAlpha = a; ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, e.r * (i / e.trail.length), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r*2.4);
  if (e.type === 'target' && e.rainbow){
    g.addColorStop(0, '#fff');
    g.addColorStop(.4, `hsl(${(now()/8)%360},90%,65%)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
  } else if (e.type === 'resource' && e.rarity === 'rare'){
    g.addColorStop(0, blend(e.color, '#ffffff', 0.6));
    g.addColorStop(0.5, e.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
  } else { g.addColorStop(0, e.color); g.addColorStop(1, 'rgba(0,0,0,0)'); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(e.x, e.y, e.r*2.4, 0, 7); ctx.fill();

  let coreColor = (e.type === 'target' && e.rainbow) ? `hsl(${(now()/8)%360},90%,60%)` : e.color;
  let cr = e.r;
  ctx.fillStyle = coreColor;
  ctx.beginPath(); ctx.arc(e.x, e.y, cr, 0, 7); ctx.fill();

  if (e.type === 'resource' && e.rarity === 'rare'){
    const k = (Math.sin(now()/300) + 1) / 2;          // 稀有：金色呼吸光环 + 星标
    ctx.strokeStyle = hexA(blend(e.color, '#ffcf5b', 0.6), 0.5 + 0.4*k);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 6 + k*3, 0, 7); ctx.stroke();
    ctx.fillStyle = hexA('#ffcf5b', 0.85);
    ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('✦', e.x + e.r*0.75, e.y - e.r*0.75);
    ctx.textBaseline = 'alphabetic';
  }

  if (e.type === 'creation'){
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, 0, 7); ctx.stroke();
  }

  if (e.name){
    ctx.fillStyle = 'rgba(255,255,255,.82)'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(e.name, e.x, e.y - e.r - 6);
  }
}

/* ============================ 浪潮绘制（柔边波浪，非硬边矩形） ============================ */
function drawWave(w){
  if (w.status === 'done') return;
  const tn = now() / 1000;
  const alpha = 0.12 + 0.05 * w.pass;            // 三轮逐次加深
  ctx.save();
  if (w.dir === 'L' || w.dir === 'R'){
    const cx = w.progress * W, th = w.curThick || w.wallThick;
    // 横向柔边渐变带（中心亮、两边透明）
    const g = ctx.createLinearGradient(cx - th, 0, cx + th, 0);
    g.addColorStop(0, hexA(w.color, 0)); g.addColorStop(0.5, hexA(w.color, alpha)); g.addColorStop(1, hexA(w.color, 0));
    ctx.fillStyle = g; ctx.fillRect(cx - th, 0, th*2, H);
    // 翻滚波浪线（多条相位差的正弦竖曲线）
    for (let k = 0; k < 3; k++){
      ctx.beginPath();
      const freq = 0.02 + k*0.012, amp = 7 + k*5, phase = tn*(1.1 + k*0.4) + k*2;
      for (let y = 0; y <= H; y += 8){ const x = cx + Math.sin(y*freq + phase)*amp; y===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); }
      ctx.strokeStyle = hexA(blend(w.color, '#ffffff', 0.5), alpha*0.55); ctx.lineWidth = 1.4; ctx.stroke();
    }
  } else {
    const cy = w.progress * H, th = w.curThick || w.wallThick;
    const g = ctx.createLinearGradient(0, cy - th, 0, cy + th);
    g.addColorStop(0, hexA(w.color, 0)); g.addColorStop(0.5, hexA(w.color, alpha)); g.addColorStop(1, hexA(w.color, 0));
    ctx.fillStyle = g; ctx.fillRect(0, cy - th, W, th*2);
    for (let k = 0; k < 3; k++){
      ctx.beginPath();
      const freq = 0.02 + k*0.012, amp = 7 + k*5, phase = tn*(1.1 + k*0.4) + k*2;
      for (let x = 0; x <= W; x += 8){ const y = cy + Math.sin(x*freq + phase)*amp; x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); }
      ctx.strokeStyle = hexA(blend(w.color, '#ffffff', 0.5), alpha*0.55); ctx.lineWidth = 1.4; ctx.stroke();
    }
  }
  ctx.restore();
}

const STATE_LABEL = { wandering:'游荡', observing:'观察', participating:'参与', reacting:'反应',
  fleeing:'躲避', fascinated:'着迷', gathering:'聚拢', wary:'警觉' };

/* ============================ 学生创造：原话保存 → 规则归一化 ============================ */
function parseCreation(text){
  const rules = [];
  let targetId = null, remixOf = null;
  const unsupported = [];
  let fallback = false;
  const has = re => re.test(text);

  // 样例1：碰到蓝色光斑的人，要和另一个人一起把它变成彩虹
  if (has(/蓝色/) && has(/彩虹/)){
    const tgt = makeTarget('#3a7bff', '蓝色光斑');
    world.targets.push(tgt); targetId = tgt.id;
    rules.push({ condition:{ type:'co_presence', count:2, distance:80 },
                 action:{ type:'change_color', value:'rainbow' },
                 meta:'blue_rainbow', targetId: tgt.id, cooldown:4000 });
  }
  // 样例2：倒霉事件撞到生命体之后，会把附近的光斑全部吹走
  if (has(/倒霉/) && (has(/吹走/) || has(/吹散/) || has(/推开/))){
    rules.push({ condition:{ type:'collision', targetType:'life' },
                 action:{ type:'blow_away', radius:185 },
                 meta:'badluck_blow', cooldown:2500 });
  }
  // 样例3：资源被生命体碰到后，会生成一个新的玩具
  if (has(/资源/) && has(/生成/) && has(/玩具|礼物|新[的]?物件|新的东西/)){
    rules.push({ condition:{ type:'touch', target:'resource' },
                 action:{ type:'spawn', objectType:'玩具', tags:['toy'] },
                 meta:'toy_spawn', cooldown:3500 });
  }
  // 通用：生成/长出 X（生命体靠近时）
  if (rules.length === 0 && has(/生成|长出|冒出/)){
    const m = text.match(/(?:生成|长出|冒出)[了]?[一]?[朵个片只座件]([^，。\s]{1,4})/);
    const noun = m ? m[1] : '新物体';
    rules.push({ condition:{ type:'life_nearby', distance:70 },
                 action:{ type:'spawn', objectType:noun, tags:[] },
                 meta:'spawn_' + noun, cooldown:3000 });
  }
  // 通用：消耗资源
  if (rules.length === 0 && has(/消耗|吃掉|用完/)){
    rules.push({ condition:{ type:'resource_nearby', distance:85 },
                 action:{ type:'consume_resource', tags:[] },
                 meta:'consume', cooldown:3000 });
  }
  // 通用：邀请/一起
  if (rules.length === 0 && has(/邀请|叫.{0,4}一起|一起来|带.{0,2}参加/)){
    rules.push({ condition:{ type:'co_presence', count:2, distance:80 },
                 action:{ type:'invite' }, meta:'invite', cooldown:4500, targetId });
  }
  // 通用：改变方向 / 吹走（事件碰撞）
  if (rules.length === 0 && has(/改变方向|吹走|推开/)){
    rules.push({ condition:{ type:'collision', targetType:'life' },
                 action:{ type:'change_direction' }, meta:'chgdir', cooldown:2500 });
  }
  // 兜底
  if (rules.length === 0){
    fallback = true;
    unsupported.push('未能识别具体动作，仅记录“被发现”');
    rules.push({ condition:{ type:'life_nearby', distance:70 },
                 action:{ type:'leave_trace', traceType:'creation_triggered' },
                 meta:'generic', cooldown:3000 });
  }

  // remix：基于已有作品的新版本
  if (has(/新版本|升级|再做一个|改一版|改进|重做/)){
    const last = world.creations[world.creations.length - 1];
    if (last) remixOf = last.id;
  }

  return { rules, targetId, unsupported, fallback, remixOf };
}

function buildCreation(text, id, creator, title){
  const p = parseCreation(text);
  const c = makeCreation({
    id: id || ('cre_'+uid()), creatorId: creator || 'student',
    title: title || (text.slice(0,12) + (text.length > 12 ? '…' : '')),
    originalDescription: text, rules: p.rules, targetId: p.targetId
  });
  c.unsupported = p.unsupported; c.fallback = p.fallback; c.remixOf = p.remixOf;
  world.creations.push(c);
  if (p.remixOf){
    addRecognition({ creationId:c.id, actorId: creator || 'student', type:'remixed', relatedCreationId: p.remixOf });
    addTrace({ type:'object_spawned', creationId:c.id,
      description:`《${c.title}》是基于已有作品的新版本` });
    floatText(c.x, c.y - 22, '产生了新版本', '#b06bff');
  }
  addTrace({ type:'creation_triggered', creationId: c.id,
    description:`学生创造了《${c.title}》：${text}` });
  return c;
}

/* 服务器中转：学生端 POST 存服务器，大屏拉取（跨会话/后开都能收到，不丢消息） */
function apiPath(p){
  const bp = new URLSearchParams(location.search).get('bp');
  if (bp) return bp + p;
  // 嗅探：a3 页面自身就在 basePath 子路径下（如 /lesson2/a3/bigscreen.html），取其前缀拼 API
  const m = location.pathname.match(/^(\/[^/]*)\/a3\//);
  return (m ? m[1] : '') + p;
}
function syncLivesFromServer(){
  fetch(apiPath('/api/a3/world/life'), { headers:{'Content-Type':'application/json'} })
    .then(r => r.json()).then(j => {
      if (!j || !j.lives) return;
      const remote = j.lives;
      const localIds = new Set(world.lives.filter(l => l.studentId).map(l => l.studentId));
      const remoteIds = new Set(remote.map(r => r.studentId));
      for (const r of remote){ if (r.studentId && !localIds.has(r.studentId)) spawnStudentLife(r); }
      world.lives = world.lives.filter(l => !l.studentId || remoteIds.has(l.studentId));
    }).catch(() => {});
}

var __popupBox = null;
var __popupLast = null;
function ensurePopupBox(){
  if (__popupBox) return __popupBox;
  const ov = document.createElement('div');
  ov.id = 'tip-overlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(4,17,26,0.72);backdrop-filter:blur(4px)';
  const card = document.createElement('div');
  card.style.cssText = 'max-width:720px;width:86%;padding:34px 40px;background:linear-gradient(180deg,#0e2940,#081a2b);border:1px solid rgba(120,200,230,0.3);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.5)';
  const title = document.createElement('div');
  title.id = 'tip-overlay-title';
  title.style.cssText = 'font-size:30px;font-weight:800;color:#39d6ff;margin-bottom:18px;letter-spacing:1px';
  const listBox = document.createElement('div');
  listBox.id = 'tip-overlay-lines';
  listBox.style.cssText = 'display:flex;flex-direction:column;gap:14px';
  const foot = document.createElement('div');
  foot.style.cssText = 'margin-top:26px;font-size:14px;color:#7fa6b8;text-align:center';
  foot.textContent = '讲完后由老师收起本窗，游戏继续';
  card.appendChild(title); card.appendChild(listBox); card.appendChild(foot);
  ov.appendChild(card);
  document.body.appendChild(ov);
  __popupBox = ov;
  return ov;
}
function renderPopup(content){
  const def = TIP_DEFS[content] || TIP_DEFS.usage;
  ensurePopupBox();
  document.getElementById('tip-overlay-title').textContent = def.title;
  const listBox = document.getElementById('tip-overlay-lines');
  listBox.innerHTML = '';
  def.lines.forEach(line => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:12px;align-items:flex-start';
    const dot = document.createElement('span');
    dot.style.cssText = 'color:#ffd27a;font-size:18px;font-weight:800;line-height:1.5';
    dot.textContent = '·';
    const txt = document.createElement('span');
    txt.style.cssText = 'font-size:21px;line-height:1.5;color:#cfeaf6;text-align:left';
    txt.textContent = line;
    row.appendChild(dot); row.appendChild(txt);
    listBox.appendChild(row);
  });
  __popupBox.style.display = 'flex';
}
function hidePopup(){
  if (__popupBox) __popupBox.style.display = 'none';
}
function pollPopup(){
  fetch(apiPath('/api/world/popup'), { cache: 'no-store' })
    .then(r => r.json())
    .then(j => {
      const show = !!(j && j.show);
      const content = (j && j.content) || null;
      const key = show + '|' + content;
      if (key === __popupLast) return; // 状态没变不动 DOM，防闪烁
      __popupLast = key;
      if (show) renderPopup(content);
      else hidePopup();
    })
    .catch(() => {});
}
try { pollPopup(); setInterval(pollPopup, 2000); } catch(_) {}

/* —— 生命名单（roster）渲染 —— */
function renderRoster(){
  const box = document.getElementById('roster');
  if (!box) return;
  if (!world.lives.length){ box.innerHTML = '<div class="empty">还没有生命。老师释放或学生进入后，这里会列出名字。</div>'; return; }
  box.innerHTML = world.lives.map(l => {
    const top = Object.entries(l.dims||{}).sort((a,b)=>b[1]-a[1]).slice(0,3)
      .map(([k,v])=>`${k}${Math.round(v)}`).join('·');
    return `<div class="item"><i class="dot" style="background:hsl(${l.hue},85%,62%)"></i>`
      + `<span class="nm">${esc(l.name)}</span>`
      + `<span class="sub">${l.creator==='缸'?'演示':('学员·'+esc(l.creator))} · 总分${Math.round(lifeScore(l))}</span>`
      + `<span class="pill" style="font-size:11px;margin-left:auto">${top}</span></div>`;
  }).join('');
}

/* —— 当前潮流 / 浪潮 —— */
function renderTrends(){
  const box = document.getElementById('trends');
  if (!box) return;
  const active = (world.waves||[]).filter(w => w.status === 'active');
  if (!active.length){ box.innerHTML = '<div class="empty">暂无浪潮。</div>'; return; }
  box.innerHTML = active.map(w => {
    const d = WAVE_DEFS.find(x => x.type === w.waveType) || {};
    const label = (d.event && d.event.name) || w.name || w.waveType;
    return `<div class="item"><i class="dot" style="background:#7C5CFF"></i>`
      + `<span class="nm">${esc(label)}</span>`
      + `<span class="sub">进度 ${Math.round((w.progress||0))}%</span></div>`;
  }).join('');
}

init();
