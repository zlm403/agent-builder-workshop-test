<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI 这几年</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: radial-gradient(1400px 700px at 50% -10%,#13203a,#0b1120 60%);
    color:#e2e8f0;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 3vh 3vw; overflow:hidden;
  }
  .title {
    font-size: clamp(26px,3.4vw,48px); font-weight:900;
    background:linear-gradient(180deg,#f8fafc,#fbbf24);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom: 2vh;
  }
  svg { flex:1; width:100%; min-height:0; max-height: calc(100vh - 12vh); }
</style>
</head>
<body>
  <div class="title">AI 这几年，帮人做成了多少事</div>

  <svg viewBox="0 0 1500 800" preserveAspectRatio="xMidYMid meet" role="img" aria-label="AI 时间线与应用叠加图">
    <defs>
      <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#fb923c"/>
      </linearGradient>
      <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#6366f1"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <!-- 纵轴：应用层级标签（从底到顶） -->
    <g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#94a3b8" text-anchor="end">
      <text x="110" y="640">回答我（问答/答疑）</text>
      <text x="110" y="552">帮我写（文案/简历）</text>
      <text x="110" y="464">帮我看（图片/文档）</text>
      <text x="110" y="376">帮我做（图/视频/网站）</text>
      <text x="110" y="288">跟我干（智能体跑全流程）</text>
      <text x="110" y="200">一起创造（做产品/发布）</text>
    </g>

    <!-- 阶段柱（从底往上叠加） -->
    <!-- 2022.11 · 会聊天 -->
    <g>
      <rect x="220" y="590" width="210" height="55" fill="url(#bar)" rx="10"/>
      <text x="325" y="623" text-anchor="middle" font-size="22" font-weight="800" fill="#431407">会聊天</text>
    </g>
    <!-- 2023 · 更聪明 + 能看 -->
    <g>
      <rect x="460" y="500" width="250" height="145" fill="url(#bar2)" rx="10" opacity=".95"/>
      <text x="585" y="556" text-anchor="middle" font-size="22" font-weight="800" fill="#0c1a2e">更聪明（GPT-4）</text>
      <text x="585" y="588" text-anchor="middle" font-size="18" fill="#1e293b">能看懂图（多模态）</text>
    </g>
    <!-- 2024 · 会做内容 -->
    <g>
      <rect x="740" y="392" width="270" height="253" fill="url(#bar)" rx="10" opacity=".92"/>
      <text x="875" y="508" text-anchor="middle" font-size="22" font-weight="800" fill="#431407">帮你做图</text>
      <text x="875" y="540" text-anchor="middle" font-size="22" font-weight="800" fill="#431407">做 PPT / 视频</text>
      <text x="875" y="572" text-anchor="middle" font-size="22" font-weight="800" fill="#431407">搭网站</text>
    </g>
    <!-- 2025 · 会自己干完一件事 -->
    <g>
      <rect x="1040" y="272" width="280" height="373" fill="url(#bar2)" rx="10" opacity=".92"/>
      <text x="1180" y="428" text-anchor="middle" font-size="22" font-weight="800" fill="#0c1a2e">智能体（Agent）</text>
      <text x="1180" y="462" text-anchor="middle" font-size="20" fill="#1e293b">一句话，它自己</text>
      <text x="1180" y="490" text-anchor="middle" font-size="20" fill="#1e293b">干完一整件事</text>
      <text x="1180" y="524" text-anchor="middle" font-size="20" fill="#1e293b">会写代码（AI Coding）</text>
    </g>
    <!-- 2026 · 今天 · 普通人创造 -->
    <g>
      <rect x="1350" y="140" width="150" height="505" fill="#fbbf24" rx="10" opacity="1" filter="url(#glow)"/>
      <text x="1425" y="360" text-anchor="middle" font-size="24" font-weight="900" fill="#431407">今天</text>
      <text x="1425" y="394" text-anchor="middle" font-size="19" font-weight="700" fill="#431407">普通人</text>
      <text x="1425" y="420" text-anchor="middle" font-size="19" font-weight="700" fill="#431407">也能做出</text>
      <text x="1425" y="446" text-anchor="middle" font-size="19" font-weight="700" fill="#431407">自己的作品</text>
    </g>

    <!-- 横轴年份 -->
    <g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">
      <text x="325" y="690">2022.11</text>
      <text x="585" y="690">2023</text>
      <text x="875" y="690">2024</text>
      <text x="1180" y="690">2025</text>
      <text x="1425" y="690">2026 · 今天</text>
    </g>
    <g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#94a3b8" text-anchor="middle">
      <text x="325" y="716">ChatGPT-3.5</text>
      <text x="585" y="716">GPT-4 · 多模态</text>
      <text x="875" y="716">应用爆发</text>
      <text x="1180" y="716">智能体 · AI Coding</text>
      <text x="1425" y="716">AI 应用时代</text>
    </g>
  </svg>
</body>
</html>
