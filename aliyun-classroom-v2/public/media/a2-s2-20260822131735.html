    .overall-shade {
      position: absolute; inset: 0; z-index: -2;
      background:
        linear-gradient(90deg,
          rgba(2,7,14,0.16) 0%,
          rgba(2,7,14,0.10) 32%,
          rgba(2,7,14,0.42) 64%,
          rgba(2,7,14,0.82) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.14), rgba(0,0,0,0.40));
    }

    .topbar {
      position: absolute; top: 0; left: 0;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
      padding: clamp(25px, 4vh, 52px) clamp(30px, 5vw, 82px);
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
      color: rgba(241,246,255,0.72);
      font-size: clamp(13px, 0.9vw, 17px); font-weight: 650; letter-spacing: 0.12em;
    }
    .brand::before {
      width: 8px; height: 8px; border-radius: 50%;
      background: #b6d3ff; box-shadow: 0 0 18px rgba(155,198,255,0.95); content: "";
    }
    .progress { display: flex; align-items: center; gap: 12px; }
    .progress-line { width: 150px; height: 3px; overflow: hidden; border-radius: 20px; background: rgba(224,234,255,0.18); }
    .progress-line::before {
      display: block; width: 28%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #9dc5ff, #b59dff);
      box-shadow: 0 0 14px rgba(139,183,255,0.9); content: "";
    }

    /* 混乱碎片层（右半为主，少量覆盖左侧营造“脑子乱”） */
    .chaos { position: absolute; inset: 0; z-index: 1; }

    /* 缠绕的虚线网 */
    .wires {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 0; opacity: 0; animation: fadeSoft 1200ms 700ms both ease-out;
    }
    .wires path {
      fill: none;
      stroke: rgba(168, 200, 255, 0.28);
      stroke-width: 1.4;
      stroke-dasharray: 5 7;
      animation: drift 9s linear infinite;
    }
    @keyframes drift { to { stroke-dashoffset: -120; } }
    @keyframes fadeSoft { from { opacity: 0; } to { opacity: 1; } }

    /* 碎片：外层负责“蹦出”定位，内层负责持续浮动 */
    .frag-slot {
      position: absolute;
      opacity: 0; transform: scale(0.4);
      animation: fragPop 620ms cubic-bezier(0.34, 1.56, 0.64, 1) var(--pop, 0.8s) both;
    }
    @keyframes fragPop {
      0%   { opacity: 0; transform: scale(0.3) rotate(-6deg); }
      70%  { opacity: 1; transform: scale(1.08) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    .fragment {
      position: relative;
      display: inline-block;
      padding: 0.7rem 1.2rem;
      border-radius: 15px;
      /* ① 每个字下面都有毛玻璃模糊蒙版，和画面区分开 */
      background: rgba(18, 30, 50, 0.55);
      border: 1px solid rgba(169, 202, 255, 0.42);
      backdrop-filter: blur(11px) saturate(120%);
      -webkit-backdrop-filter: blur(11px) saturate(120%);
      /* ③ 字更大、更亮 */
      color: #eaf2ff;
      font-size: clamp(1.08rem, 1.4vw, 1.5rem);
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      box-shadow: 0 14px 36px rgba(4, 9, 18, 0.5);
      animation: floatA 6s ease-in-out infinite alternate;
    }
    .fragment.q { font-size: clamp(2rem, 3vw, 3.4rem); font-weight: 700; color: #fff; padding: 0.15rem 0.8rem; }

    /* ② 蹦出后的“点亮”光晕：短暂发光再回落 */
    .fragment::after {
      content: "";
      position: absolute; inset: -7px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 0 0 rgba(180, 212, 255, 0);
      animation: glowPulse 1.1s ease calc(var(--pop, 0.8s) + 0.5s) 1 both;
    }
    @keyframes glowPulse {
      0%   { opacity: 0; box-shadow: 0 0 0 0 rgba(180,212,255,0); }
      30%  { opacity: 1; box-shadow: 0 0 30px 9px rgba(180,212,255,0.6); }
      100% { opacity: 0; box-shadow: 0 0 0 0 rgba(180,212,255,0); }
    }

    /* 浮动变体（不安定的思绪） */
    .float-a { animation-name: floatA; }
    .float-b { animation-name: floatB; }
    .float-c { animation-name: floatC; }
    @keyframes floatA { from { transform: translate(0,0) rotate(0); } to { transform: translate(7px, -9px) rotate(2deg); } }
    @keyframes floatB { from { transform: translate(0,0) rotate(0); } to { transform: translate(-8px, 6px) rotate(-2.5deg); } }
    @keyframes floatC { from { transform: translate(0,0) rotate(0); } to { transform: translate(5px, 8px) rotate(1.5deg); } }

    /* 颜色混杂 */
    .c-blue   { border-color: rgba(157,198,255,0.45); color: #d6e6ff; }
    .c-violet { border-color: rgba(201,184,255,0.45); color: #e3daff; }
    .c-amber  { border-color: rgba(255,215,154,0.42); color: #ffe9c9; }
    .c-soft   { border-color: rgba(203,220,255,0.16); color: rgba(244,247,255,0.78); }

    /* 错落蹦出（用 --pop 控制蹦出时间，fragment::after 的点亮自动跟随） */
    .frag-slot:nth-child(2)  { --pop: 0.8s; }
    .frag-slot:nth-child(3)  { --pop: 1.15s; }
    .frag-slot:nth-child(4)  { --pop: 0.55s; }
    .frag-slot:nth-child(5)  { --pop: 1.5s; }
    .frag-slot:nth-child(6)  { --pop: 0.95s; }
    .frag-slot:nth-child(7)  { --pop: 1.85s; }
    .frag-slot:nth-child(8)  { --pop: 1.3s; }
    .frag-slot:nth-child(9)  { --pop: 2.2s; }
    .frag-slot:nth-child(10) { --pop: 1.05s; }
    .frag-slot:nth-child(11) { --pop: 2.5s; }
    .frag-slot:nth-child(12) { --pop: 1.65s; }
    .frag-slot:nth-child(13) { --pop: 2.9s; }

    /* 点题 */
    .point {
      position: absolute; z-index: 2;
      left: clamp(40px, 6vw, 90px); bottom: clamp(70px, 12vh, 130px);
      max-width: 520px;
      opacity: 0; transform: translateY(18px);
      animation: appear 1000ms 3000ms both ease-out;
    }
    .point h2 {
      margin: 0; color: var(--white);
      font-size: clamp(26px, 2.4vw, 44px); font-weight: 680; line-height: 1.3;
      letter-spacing: -0.02em;
    }
    .point p {
      margin: 14px 0 0; color: rgba(232,238,250,0.66);
      font-size: clamp(15px, 1.1vw, 20px); line-height: 1.6;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 900px) {
      html, body { overflow: auto; }
      .screen { min-height: 900px; }
      .fragment { font-size: 0.85rem; padding: 0.5rem 0.85rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

<body>
  <main class="screen">
    <div class="background"></div>
    <div class="overall-shade"></div>

    <header class="topbar">
      <div class="brand">接下来，我会怎么做？</div>
      <div class="progress"><div class="progress-line"></div></div>
    </header>

    <div class="chaos">
      <!-- 缠绕虚线网 -->
      <svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none" vector-effect="non-scaling-stroke">
        <path d="M44,20 C60,30 38,44 64,40 C84,37 70,56 88,52" />
        <path d="M70,14 C58,32 80,44 50,52 C40,57 62,70 76,66" />
        <path d="M88,26 C68,36 86,50 62,60 C48,66 72,80 84,86" />
        <path d="M42,54 C56,60 44,74 66,76 C80,77 60,86 78,90" />
        <path d="M52,30 C66,40 46,50 72,48" />
      </svg>

      <!-- 杂乱念头碎片（错落蹦出 + 持续浮动） -->
      <div class="frag-slot" style="left:45%; top:15%;"><span class="fragment c-blue float-a">先查资料？</span></div>
      <div class="frag-slot" style="left:68%; top:11%;"><span class="fragment c-violet float-b">网站有哪些内容</span></div>
      <div class="frag-slot" style="left:84%; top:21%;"><span class="fragment c-soft float-c">页面怎么设计</span></div>
      <div class="frag-slot" style="left:51%; top:33%;"><span class="fragment c-amber float-b">AI 能写代码吗</span></div>
      <div class="frag-slot" style="left:73%; top:36%;"><span class="fragment q float-a">?</span></div>
      <div class="frag-slot" style="left:86%; top:46%;"><span class="fragment c-blue float-c">用什么框架</span></div>
      <div class="frag-slot" style="left:43%; top:50%;"><span class="fragment c-violet float-a">用户到底是谁</span></div>
      <div class="frag-slot" style="left:62%; top:55%;"><span class="fragment c-soft float-b">会不会太难</span></div>
      <div class="frag-slot" style="left:80%; top:64%;"><span class="fragment c-amber float-c">时间够不够</span></div>
      <div class="frag-slot" style="left:49%; top:70%;"><span class="fragment c-blue float-a">先做什么好</span></div>
      <div class="frag-slot" style="left:70%; top:78%;"><span class="fragment q float-b">?</span></div>
      <div class="frag-slot" style="left:85%; top:83%;"><span class="fragment c-violet float-c">怎么算做完</span></div>
    </div>

    <div class="point">
      <h2>事情，好像比我想的复杂一点。</h2>
      <p>它们彼此牵连，我想了很久，还是不知道该先从哪一步开始。</p>
    </div>
  </main>

  <script>/* A2 幻灯片导航脚本
 * 键盘：F 全屏 | ← / → 切换页面 | 1-9 跳转到对应页 | R 重置动画 | Space 触发当前页动画
 * 需在每页 body 上添加 data-slide 属性，值为当前页序号（从 0 开始）
 */

(function () {
  const slides = [
    'A2-S0.html',
    'A2-S2.html',
    'A2-S3.html',
    'A2-S4.html',
    'A2-S5.html',
    'A2-S6.html',
    'A2-S7.html',
    'A2-S8.html',
    'A2-S9.html',
    'A2-S10.html',
  ];

  const currentFile = window.location.pathname.split('/').pop() || slides[0];
  let currentIndex = slides.indexOf(currentFile);
  if (currentIndex === -1) currentIndex = 0;

  function go(index) {
    if (index < 0 || index >= slides.length) return;
    window.location.href = slides[index];
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  function resetAnimations() {
    document.querySelectorAll('.visible').forEach((el) => {
      el.classList.remove('visible');
      void el.offsetWidth;
      el.classList.add('visible');
    });
  }

  function triggerAnimations() {
    document.querySelectorAll('[data-animate]').forEach((el) => {
      const delay = parseFloat(el.dataset.animate) || 0;
      setTimeout(() => el.classList.add('visible'), delay * 1000);
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    switch (e.key) {
      case 'ArrowRight':
      case 'PageDown':
      case ' ': // Space 下一页
        e.preventDefault();
        go(currentIndex + 1);
        break;
      case 'ArrowLeft':
      case 'PageUp':
        e.preventDefault();
        go(currentIndex - 1);
        break;
      case 'f':
      case 'F':
        e.preventDefault();
        toggleFullscreen();
        break;
      case 'r':
      case 'R':
        e.preventDefault();
        resetAnimations();
        break;
      case '1':
      case '2':
      case '3':
      case '4':
      case '5':
      case '6':
      case '7':
      case '8':
      case '9':
        e.preventDefault();
        const target = parseInt(e.key, 10) - 1;
        go(target);
        break;
    }
  });

  // —— 远程控制（教师端 → 大屏）——
  // 同机同源：BroadcastChannel('a2-screen')；也兼容 window.postMessage。
  // 指令：{action:'next'|'prev'|'step'|'goto'|'reset'}
  //   当前屏可注册 window.__screenStep(dir) 消费指令（返回 true 表示“本屏内部消化，不要翻页”）。
  function remoteNext() {
    const consumed = typeof window.__screenStep === 'function' && window.__screenStep(1);
    if (!consumed) go(currentIndex + 1);
  }
  function remotePrev() {
    const consumed = typeof window.__screenStep === 'function' && window.__screenStep(-1);
    if (!consumed) go(currentIndex - 1);
  }
  function handleRemote(d) {
    if (!d || !d.action) return;
    switch (d.action) {
      case 'next': remoteNext(); break;
      case 'prev': remotePrev(); break;
      case 'step': if (window.__screenStep) window.__screenStep(d.dir === -1 ? -1 : 1); break;
      case 'goto': if (typeof d.index === 'number') go(d.index); break;
      case 'reset': location.reload(); break;
    }
  }
  try {
    const bc = new BroadcastChannel('a2-screen');
    bc.onmessage = (e) => handleRemote(e.data);
  } catch (_) {}
  window.addEventListener('message', (e) => handleRemote(e.data));

  // 页面加载后自动触发带 data-animate 的元素
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', triggerAnimations);
  } else {
    triggerAnimations();
  }
})();
</script>
</body>
</html>
