      transform: scale(1.015);
    }
    .overall-shade {
      position: absolute; inset: 0; z-index: -2;
      background:
        linear-gradient(90deg,
          rgba(2,7,14,0.10) 0%,
          rgba(2,7,14,0.04) 40%,
          rgba(2,7,14,0.26) 62%,
          rgba(2,7,14,0.62) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.32));
    }

    .topbar {
      position: absolute; top: 0; left: 0; z-index: 6;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
      padding: clamp(25px, 4vh, 52px) clamp(30px, 5vw, 82px);
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
      color: rgba(241,246,255,0.72);
      font-size: clamp(13px, 0.9vw, 17px); font-weight: 650; letter-spacing: 0.12em;
    }
    .brand::before {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--violet);
      box-shadow: 0 0 18px rgba(201,184,255,0.9); content: "";
    }
    .progress { display: flex; align-items: center; gap: 12px; }
    .progress-line { width: 150px; height: 3px; overflow: hidden; border-radius: 20px; background: rgba(224,234,255,0.18); }
    .progress-line::before {
      display: block; width: 44%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #9dc5ff, #c9b8ff);
      box-shadow: 0 0 14px rgba(180,160,255,0.9); content: "";
    }

    .main {
      position: relative; display: flex; justify-content: flex-end;
      width: min(var(--page-width), 100%); height: 100%; margin: 0 auto;
      padding: clamp(115px, 16vh, 180px) clamp(38px, 8vw, 140px) 80px 40px;
    }

    /* 文字区毛玻璃蒙版：0–2.5s 透明，之后淡入 */
    .logic-area {
      position: relative; width: min(680px, 50vw);
      padding: clamp(30px, 3vw, 46px) clamp(32px, 3vw, 50px);
      border-radius: 22px;
      background: rgba(12, 22, 38, 0.34);
      border: 1px solid rgba(203, 220, 255, 0.14);
      box-shadow: 0 24px 70px rgba(4, 9, 18, 0.42);
      backdrop-filter: blur(9px) saturate(115%);
      -webkit-backdrop-filter: blur(9px) saturate(115%);
      opacity: 0; animation: appear 900ms 2500ms both ease-out;
      transition: opacity 600ms ease;
    }

    .kicker {
      display: flex; align-items: center; gap: 11px; margin-bottom: 18px;
      color: var(--violet); font-size: clamp(14px, 1vw, 18px);
      font-weight: 650; letter-spacing: 0.08em; opacity: 0; animation: appear 700ms 2750ms both ease-out;
    }
    .kicker::before { width: 30px; height: 1px; background: var(--violet); box-shadow: 0 0 12px rgba(201,184,255,0.8); content: ""; }

    /* 转折大字：不。 */
    .turn-1 {
      margin: 0;
      font-size: clamp(64px, 7vw, 120px); font-weight: 720; line-height: 1;
      letter-spacing: -0.04em; color: var(--white);
      opacity: 0; transform: translateY(18px); animation: appear 800ms 2850ms both ease-out;
    }
    /* 这一次，不是我来做。 */
    .turn-2 {
      margin: 14px 0 0;
      font-size: clamp(26px, 2.3vw, 42px); font-weight: 620; line-height: 1.3;
      color: rgba(244,247,255,0.94);
      opacity: 0; transform: translateY(18px); animation: appear 800ms 3650ms both ease-out;
    }
    .turn-2 strong { color: var(--violet); font-weight: 700; }

    /* 我找人来做。 */
    .turn-3 {
      margin: 22px 0 6px;
      font-size: clamp(20px, 1.5vw, 28px); font-weight: 600;
      color: var(--accent);
      opacity: 0; transform: translateY(18px); animation: appear 800ms 4450ms both ease-out;
    }

    /* 新流程：逐条浮现 */
    .logic-list { position: relative; margin-top: 28px; padding-left: 25px; }
    .logic-list::before {
      position: absolute; top: 14px; bottom: 28px; left: 5px; width: 1px;
      background: linear-gradient(to bottom, rgba(201,184,255,0.78), rgba(201,184,255,0.12)); content: "";
    }
    .logic-item {
      position: relative; display: flex; align-items: center;
      min-height: 56px;
      color: rgba(244,247,255,0.92);
      font-size: clamp(18px, 1.3vw, 25px); line-height: 1.45;
      opacity: 0; transform: translateX(-14px);
      animation: itemIn 820ms both cubic-bezier(0.22, 1, 0.36, 1);
    }
    .logic-item::before {
      position: absolute; left: -25px; width: 11px; height: 11px;
      border: 2px solid rgba(205,192,255,0.9); border-radius: 50%; background: #1a1730;
      box-shadow: 0 0 14px rgba(201,184,255,0.5); content: "";
      transform: scale(0); animation: dotPop 380ms cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .logic-item:not(:last-child)::after {
      position: absolute; bottom: -2px; left: -29px;
      color: rgba(201,184,255,0.62); font-size: 17px; content: "↓";
      opacity: 0; animation: arrowIn 400ms ease both;
    }
    .logic-item .emphasis { color: var(--violet); font-weight: 650; }

    /* 每条扫光 */
    .logic-item .sweep {
      position: absolute; inset: -2px 0; border-radius: 10px; pointer-events: none;
      background: linear-gradient(100deg, transparent 0%, rgba(220,210,255,0.22) 50%, transparent 100%);
      background-repeat: no-repeat; background-size: 55% 100%; background-position: -60% 0; opacity: 0;
    }
    .logic-item .sweep.go { animation: sweepLine 0.85s ease both; }

    .logic-item:nth-child(1) { animation-delay: 5250ms; }
    .logic-item:nth-child(1)::before { animation-delay: 5200ms; }
    .logic-item:nth-child(1)::after  { animation-delay: 6100ms; }
    .logic-item:nth-child(1) .sweep { animation-delay: 5280ms; }
    .logic-item:nth-child(2) { animation-delay: 6150ms; }
    .logic-item:nth-child(2)::before { animation-delay: 6100ms; }
    .logic-item:nth-child(2)::after  { animation-delay: 7000ms; }
    .logic-item:nth-child(2) .sweep { animation-delay: 6180ms; }
    .logic-item:nth-child(3) { animation-delay: 7050ms; }
    .logic-item:nth-child(3)::before { animation-delay: 7000ms; }
    .logic-item:nth-child(3)::after  { animation-delay: 7900ms; }
    .logic-item:nth-child(3) .sweep { animation-delay: 7080ms; }
    .logic-item:nth-child(4) { animation-delay: 7950ms; }
    .logic-item:nth-child(4)::before { animation-delay: 7900ms; }
    .logic-item:nth-child(4)::after  { animation-delay: 8800ms; }
    .logic-item:nth-child(4) .sweep { animation-delay: 7980ms; }
    .logic-item:nth-child(5) { animation-delay: 8850ms; }
    .logic-item:nth-child(5)::before { animation-delay: 8800ms; }
    .logic-item:nth-child(5) .sweep { animation-delay: 8880ms; }

    /* ============ 第三幕：框内模糊 · 三跳对比 ============ */
    .compare-page {
      position: absolute; inset: 0; z-index: 4;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(18px, 3vh, 34px);
      padding: clamp(86px, 11vh, 130px) clamp(28px, 5vw, 90px) clamp(70px, 9vh, 110px);
      opacity: 0; visibility: hidden;
      background: rgba(8,12,22,0.94);   /* 实底遮罩，完全盖住第一幕文字 */
      transition: opacity 650ms ease, visibility 650ms ease;
    }
    body.intro-done .logic-area { opacity: 0; pointer-events: none; }
    body.intro-done .compare-page { opacity: 1; visibility: visible; }

    /* 大方框：背景模糊 */
    .frame {
      position: relative; width: min(1180px, 88vw); height: min(64vh, 600px); min-height: 420px;
      border-radius: 26px; overflow: hidden;
      border: 1px solid rgba(203, 220, 255, 0.2);
      box-shadow: 0 40px 120px rgba(2, 6, 14, 0.55), inset 0 0 60px rgba(120, 150, 230, 0.06);
    }

    .frame-veil {
      position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(180deg, rgba(8,12,22,0.82), rgba(8,12,22,0.92)),
        radial-gradient(120% 80% at 50% 40%, rgba(40,60,110,0.18), transparent 70%);
    }

    .compare-grid {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      gap: clamp(18px, 3vw, 56px);
      width: 100%; height: 100%;
      padding: clamp(16px, 2.4vw, 34px);
    }

    .panel { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .panel-tag {
      font-size: clamp(13px, 0.95vw, 17px); letter-spacing: 0.14em; font-weight: 650;
      color: var(--muted); opacity: 0; transform: translateY(8px);
      transition: opacity 500ms ease, transform 500ms ease;
    }
    .panel.now .panel-tag { color: var(--violet); }
    .diagram {
      width: clamp(300px, 31vw, 430px); height: clamp(210px, 23vw, 300px);
      opacity: 0; transform: scale(0.96); transition: opacity 600ms ease, transform 600ms ease;
    }
    .diagram svg { width: 100%; height: 100%; overflow: visible; }

    /* 任务组：stage-1 才出现 */
    .tasks-before { opacity: 0; transition: opacity 700ms ease; }
    body.stage-1 .tasks-before, body.stage-2 .tasks-before { opacity: 1; }

    /* 核心人物（我和 AI） */
    .core-pair circle { fill: #c9b8ff; }
    .core-label { fill: #14102a; font-size: 18px; font-weight: 700; text-anchor: middle; }
    .ai-core circle { fill: #a9caff; }
    .ai-label { fill: #06203f; font-size: 18px; font-weight: 700; text-anchor: middle; }

    .task-node circle { fill: rgba(255,214,160,0.95); }
    .task-text { fill: #2a1c08; font-size: 14px; font-weight: 650; text-anchor: middle; }
    .task-line { fill: none; stroke: rgba(255,190,150,0.5); stroke-width: 1.4; stroke-dasharray: 4 6; }

    /* 现在：团队 + 指挥线 */
    .team-ring-text { fill: #ffffff; font-size: 17px; font-weight: 700; letter-spacing: 0.18em; text-anchor: middle; }
    .team-task-node circle { fill: rgba(169,202,255,0.95); }
    .team-task-text { fill: #06203f; font-size: 14px; font-weight: 650; text-anchor: middle; }
    .team-line { fill: none; stroke: rgba(150,180,255,0.55); stroke-width: 1.5; }
    .cmd-line { fill: none; stroke: rgba(201,184,255,0.85); stroke-width: 2; stroke-dasharray: 2 5; }
    .cmd-arrow { fill: none; stroke: rgba(201,184,255,0.9); stroke-width: 2; }
    .talk-label { fill: rgba(228,236,255,0.85); font-size: 11px; font-weight: 600; text-anchor: middle; }

    /* 中间重组箭头 */
    .contrast-arrow {
      display: grid; place-items: center; color: var(--violet);
      font-size: clamp(24px, 2.4vw, 40px); font-weight: 700;
      text-shadow: 0 0 18px rgba(201,184,255,0.7);
      max-width: 0; opacity: 0; overflow: hidden;
      transition: max-width 600ms ease, opacity 500ms ease;
    }
    .contrast-arrow small { display: block; font-size: 0.55rem; letter-spacing: 0.2em; color: var(--muted); margin-top: 2px; font-weight: 600; }

    /* 显示控制 */
    body.stage-0 .panel.before .diagram,
    body.stage-1 .panel.before .diagram { opacity: 1; transform: scale(1); }
    body.stage-2 .panel.before .diagram { opacity: 1; transform: scale(1); }
    body.stage-2 .panel.now .diagram { opacity: 1; transform: scale(1); }
    body.stage-2 .contrast-arrow { max-width: 80px; opacity: 1; }
    body.stage-2 .panel-tag { opacity: 1; transform: translateY(0); }
    body.stage-1 .panel.before .panel-tag { opacity: 1; transform: translateY(0); }

    /* 第三跳的“跳”动感 */
    body.stage-2 .compare-grid { animation: jumpIn 520ms cubic-bezier(0.22,1,0.36,1); }
    @keyframes jumpIn { 0% { transform: scale(0.94); opacity: 0.4; } 100% { transform: scale(1); opacity: 1; } }

    /* 底部台词 */
    .stage-caption {
      min-height: 1.6em; text-align: center; max-width: 880px;
      color: rgba(238,243,255,0.92); font-size: clamp(17px, 1.3vw, 25px); line-height: 1.55;
      opacity: 0; transform: translateY(10px); transition: opacity 500ms ease, transform 500ms ease;
    }
    body.intro-done .stage-caption { opacity: 1; transform: translateY(0); }
    .stage-caption strong { color: var(--violet); font-weight: 650; }
    .key { display: inline-block; padding: 2px 10px; border-radius: 8px; border: 1px solid rgba(201,184,255,0.4);
      color: var(--violet); font-size: 0.85em; margin: 0 2px; }

    /* 步进提示 */
    .step-hint {
      font-size: clamp(14px, 1vw, 18px); color: rgba(201,184,255,0.9); letter-spacing: 0.04em;
      opacity: 0; transform: translateY(6px); transition: opacity 400ms ease, transform 400ms ease;
    }
    .step-hint.show { opacity: 1; transform: translateY(0); }

    @keyframes appear { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes itemIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes dotPop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes arrowIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 0.62; transform: translateY(0); } }
    @keyframes sweepLine { 0% { opacity: 0; background-position: -60% 0; } 25% { opacity: 1; } 100% { opacity: 0; background-position: 130% 0; } }

    @media (max-width: 900px) {
      html, body { overflow: auto; }
      .screen { min-height: 920px; }
      .main { justify-content: center; padding: 125px 28px 70px; }
      .logic-area { width: min(680px, 100%); }
      .frame { height: 540px; }
      .compare-grid { flex-direction: column; gap: 14px; }
      .contrast-arrow { transform: rotate(90deg); max-width: none; }
      body.stage-2 .contrast-arrow { max-width: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      .logic-area { opacity: 1 !important; }
      .compare-page { opacity: 1 !important; visibility: visible !important; }
    }
  </style>
</head>

                  <g class="team-task-node"><circle cx="318" cy="44" r="24" /><text class="team-task-text" x="318" y="48">写内容</text></g>
                  <g class="team-task-node"><circle cx="348" cy="130" r="24" /><text class="team-task-text" x="348" y="134">做设计</text></g>

      <p class="stage-caption" id="stageCaption"></p>

  <script>
    (function () {
      const body = document.body;
      const cap = document.getElementById('stageCaption');
      const hint = document.getElementById('stepHint');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // 每一跳的台词
      const texts = [
        '我，和我的 AI。',
        '以前：我和 AI，要<strong>直接面对每一件事</strong>。',
        '现在：我和 AI 商量，<strong>指挥一支团队</strong>——去做同样的事。',
      ];

      if (reduce) {
        body.classList.add('intro-done', 'stage-0', 'stage-1', 'stage-2');
        cap.innerHTML = texts[2];
        hint.textContent = '按 空格 进入下一环节 →';
        hint.classList.add('show');
        return;
      }

      // 第一幕自动播完（约 9.6s），之后进入“等待教师”状态
      let introDone = false;
      let step = 0;          // 0=未进入对比; 1/2/3 对应 stage-0/1/2
      const MAX = 3;

      setTimeout(() => {
        introDone = true;
        body.classList.add('intro-done');
        hint.innerHTML = '按 <span class="key">空格</span> 进入对比 →';
        hint.classList.add('show');
      }, 10000);

      function applyStep() {
        body.classList.remove('stage-0', 'stage-1', 'stage-2');
        if (step >= 1) body.classList.add('stage-0');
        if (step >= 2) body.classList.add('stage-1');
        if (step >= 3) body.classList.add('stage-2');
        if (step >= 1) cap.innerHTML = texts[step - 1];
        else cap.innerHTML = '';
      }

      function updateHint() {
        if (step < MAX) hint.innerHTML = '按 <span class="key">空格</span> 继续 →';
        else hint.innerHTML = '按 <span class="key">空格</span> 进入下一环节 →';
      }

      // 暴露给 nav.js 的远程步进钩子：教师端发 next/prev 时调用
      // 返回 true = 本屏内部消费（不翻页）；返回 false = 已到边界，交给 nav.js 翻页
      window.__screenStep = function (dir) {
        if (!introDone) return true;            // 第一幕未播完：吞掉，不翻页
        if (dir > 0) {
          if (step < MAX) { step++; applyStep(); updateHint(); return true; }
          return false;                          // 对比已展示完：放行翻页
        }
        if (step > 1) { step--; applyStep(); updateHint(); return true; }
        return true;                             // 最前一步：吞掉，不回翻上一屏
      };

      // 本地调试用：键盘/点击推进（大屏投屏时收不到，仅开发预览方便）
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (!introDone) return;
        if ([' ', 'ArrowRight', 'Enter', 'PageDown'].includes(e.key)) {
          e.preventDefault();
          if (step < MAX) { step++; applyStep(); updateHint(); }
        } else if (['ArrowLeft', 'PageUp'].includes(e.key)) {
          e.preventDefault();
          if (step > 1) { step--; applyStep(); updateHint(); }
        }
      });
      document.querySelector('.compare-page').addEventListener('click', () => {
        if (introDone && step < MAX) { step++; applyStep(); updateHint(); }
      });
    })();
  </script>

  <script>/* A2 幻灯片导航脚本
 * 键盘：F 全屏 | ← / → 切换页面 | 1-9 跳转到对应页 | R 重置动画 | Space 触发当前页动画
 * 需在每页 body 上添加 data-slide 属性，值为当前页序号（从 0 开始）
 */

(function () {
  const slides = [
    'A2-S0.html',
    'A2-S2.html',
    'A2-S3.html',
    'A2-S4.html',
    'A2-S5.html',
    'A2-S6.html',
    'A2-S7.html',
    'A2-S8.html',
    'A2-S9.html',
    'A2-S10.html',
  ];

  const currentFile = window.location.pathname.split('/').pop() || slides[0];
  let currentIndex = slides.indexOf(currentFile);
  if (currentIndex === -1) currentIndex = 0;

  function go(index) {
    if (index < 0 || index >= slides.length) return;
    window.location.href = slides[index];
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  function resetAnimations() {
    document.querySelectorAll('.visible').forEach((el) => {
      el.classList.remove('visible');
      void el.offsetWidth;
      el.classList.add('visible');
    });
  }

  function triggerAnimations() {
    document.querySelectorAll('[data-animate]').forEach((el) => {
      const delay = parseFloat(el.dataset.animate) || 0;
      setTimeout(() => el.classList.add('visible'), delay * 1000);
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    switch (e.key) {
      case 'ArrowRight':
      case 'PageDown':
      case ' ': // Space 下一页
        e.preventDefault();
        go(currentIndex + 1);
        break;
      case 'ArrowLeft':
      case 'PageUp':
        e.preventDefault();
        go(currentIndex - 1);
        break;
      case 'f':
      case 'F':
        e.preventDefault();
        toggleFullscreen();
        break;
      case 'r':
      case 'R':
        e.preventDefault();
        resetAnimations();
        break;
      case '1':
      case '2':
      case '3':
      case '4':
      case '5':
      case '6':
      case '7':
      case '8':
      case '9':
        e.preventDefault();
        const target = parseInt(e.key, 10) - 1;
        go(target);
        break;
    }
  });

  // —— 远程控制（教师端 → 大屏）——
  // 同机同源：BroadcastChannel('a2-screen')；也兼容 window.postMessage。
  // 指令：{action:'next'|'prev'|'step'|'goto'|'reset'}
  //   当前屏可注册 window.__screenStep(dir) 消费指令（返回 true 表示“本屏内部消化，不要翻页”）。
  function remoteNext() {
    const consumed = typeof window.__screenStep === 'function' && window.__screenStep(1);
    if (!consumed) go(currentIndex + 1);
  }
  function remotePrev() {
    const consumed = typeof window.__screenStep === 'function' && window.__screenStep(-1);
    if (!consumed) go(currentIndex - 1);
  }
  function handleRemote(d) {
    if (!d || !d.action) return;
    switch (d.action) {
      case 'next': remoteNext(); break;
      case 'prev': remotePrev(); break;
      case 'step': if (window.__screenStep) window.__screenStep(d.dir === -1 ? -1 : 1); break;
      case 'goto': if (typeof d.index === 'number') go(d.index); break;
      case 'reset': location.reload(); break;
    }
  }
  try {
    const bc = new BroadcastChannel('a2-screen');
    bc.onmessage = (e) => handleRemote(e.data);
  } catch (_) {}
  window.addEventListener('message', (e) => handleRemote(e.data));

  // 页面加载后自动触发带 data-animate 的元素
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', triggerAnimations);
  } else {
    triggerAnimations();
  }
})();
</script>
</body>
