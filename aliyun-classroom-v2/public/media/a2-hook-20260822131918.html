<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2 Hook · 有人需要帮助</title>
  <style>/* A2 - 学习认知突破阶段设计系统
 * 浅色纸张风：米白纸底 + 深青文字 + 蓝紫点缀
 * 与 A1 深墨底形成对比，营造“换了世界”的新鲜感
 */

:root {
  --ink: #25323a;
  --ink-soft: #42535c;
  --paper: #f5efe7;
  --paper-2: #efe6db;
  --surface: #ffffff;
  --muted: #7d8a91;
  --rule: #e0d8cc;
  --blue: #9dc5ff;
  --blue-strong: #6ba6ff;
  --purple: #b59dff;
  --purple-strong: #9176ff;
  --amber: #f0b86c;
  --green: #7bdcc6;
  --shadow: 0 24px 70px rgba(37, 50, 58, 0.12);
  --radius: 18px;
  --font-display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

.slide {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 4vh 4vw;
  background: var(--paper);
  overflow: hidden;
}

/* 顶部眉标 */
.eyebrow {
  position: absolute;
  top: 4vh;
  left: 4vw;
  font-size: 0.85rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  z-index: 10;
}

/* 环节编号 */
.step-number {
  position: absolute;
  top: 4vh;
  right: 4vw;
  font-size: 0.8rem;
  color: var(--muted);
  z-index: 10;
}

/* 主标题 */
.headline {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4.5vw, 3.6rem);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-align: center;
  max-width: 75vw;
}

/* 副标题/说明 */
.lead {
  font-size: clamp(1rem, 1.7vw, 1.35rem);
  line-height: 1.8;
  color: var(--ink-soft);
  text-align: center;
  max-width: 60vw;
  margin-top: 1.2rem;
}

/* 卡片容器 */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 2.2rem 2.8rem;
  border: 1px solid var(--rule);
}

/* 标签/药丸 */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.45rem 0.9rem;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  background: var(--paper-2);
  color: var(--ink-soft);
  border: 1px solid var(--rule);
}

.pill.blue { background: rgba(157, 197, 255, 0.22); color: #4a7fd4; border-color: rgba(157, 197, 255, 0.5); }
.pill.purple { background: rgba(181, 157, 255, 0.18); color: #7a5fd9; border-color: rgba(181, 157, 255, 0.45); }
.pill.amber { background: rgba(240, 184, 108, 0.2); color: #a5742d; border-color: rgba(240, 184, 108, 0.45); }
.pill.green { background: rgba(123, 220, 198, 0.2); color: #3a8f7a; border-color: rgba(123, 220, 198, 0.45); }

/* 动画基础 */
.fade-in { opacity: 0; }
.fade-in.visible { animation: fadeIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

.slide-up { opacity: 0; transform: translateY(28px); }
.slide-up.visible { animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

.scale-in { opacity: 0; transform: scale(0.92); }
.scale-in.visible { animation: scaleIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

@keyframes fadeIn {
  to { opacity: 1; }
}

@keyframes slideUp {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes scaleIn {
  to { opacity: 1; transform: scale(1); }
}

@keyframes pulse-soft {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* 提示条 */
.hint {
  position: absolute;
  bottom: 3vh;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.75rem;
  color: var(--muted);
  opacity: 0.7;
  z-index: 10;
}

/* 导航热点（开发调试用） */
.nav-dots {
  position: absolute;
  bottom: 3vh;
  right: 4vw;
  display: flex;
  gap: 0.5rem;
  z-index: 10;
}

.nav-dots a {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rule);
  transition: all 0.25s ease;
}

.nav-dots a:hover,
.nav-dots a.active {
  background: var(--blue-strong);
  transform: scale(1.3);
}

/* 响应式基础 */
@media (max-width: 768px) {
  .headline { max-width: 90vw; }
  .lead { max-width: 90vw; }
  .card { padding: 1.6rem 1.8rem; }
}
</style>
  <style>
    /* 1. 满屏背景：女孩画面一直完整静态不动 */
    .hook-bg { position: absolute; inset: 0; z-index: 0; }
    .hook-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* 2. 遮罩：左亮右微暗，保证右侧文字可读，人物依旧清晰 */
    .hook-scrim {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(90deg, rgba(10,16,26,0.02) 0%, rgba(10,16,26,0.06) 45%, rgba(10,16,26,0.32) 100%);
    }

    /* 3. 消息窗口浮层（叠在右侧中部） */
    .hook-chat {
      position: absolute; z-index: 2;
      top: 50%; right: 5vw;
      width: min(520px, 44vw);
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 28px;
      box-shadow: 0 30px 90px rgba(10,16,26,0.28);
      overflow: hidden;
      opacity: 0;
      transform: translateY(-50%) scale(0.6);
      transform-origin: 80% 50%;
    }

    /* 进场：弹入 + 抖两下，然后停住 */
    .hook-chat.pop {
      animation:
        popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards,
        jitter 0.12s ease-in-out 0.95s 4;
    }
    @keyframes popIn {
      0%   { opacity: 0; transform: translateY(-50%) scale(0.6); }
      70%  { opacity: 1; transform: translateY(-50%) scale(1.06); }
      100% { opacity: 1; transform: translateY(-50%) scale(1); }
    }
    @keyframes jitter {
      0%   { transform: translateY(-50%) rotate(-1.4deg); }
      50%  { transform: translateY(-50%) rotate(1.4deg); }
      100% { transform: translateY(-50%) rotate(0); }
    }
    /* 停住后的最终态（动画结束后保持） */
    .hook-chat.rest { opacity: 1; transform: translateY(-50%) scale(1); }

    /* 顶部工具栏 */
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.4rem;
      border-bottom: 1px solid rgba(224,216,204,0.6);
      background: rgba(255,255,255,0.7);
    }
    .chat-tools { display: flex; gap: 1rem; color: #5b6770; }
    .chat-tools svg { width: 19px; height: 19px; stroke-width: 2; opacity: 0.7; }
    .chat-status { font-size: 0.78rem; color: #5b6770; letter-spacing: 0.05em; }

    /* 文字显示区 */
    .chat-body { padding: 2.2rem 2.2rem 1.9rem; display: flex; flex-direction: column; gap: 1.1rem; }
    .chat-meta { display: flex; align-items: center; gap: 0.75rem; }
    .chat-avatar {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      border: 2px solid rgba(239,230,219,0.9);
    }
    .chat-name { font-size: 0.95rem; font-weight: 700; color: var(--ink); }
    .chat-role { font-size: 0.75rem; color: #6f7d85; }

    /* 文字逐字浮现 + 光扫过 */
    .chat-text {
      position: relative;
      font-size: clamp(1.15rem, 1.9vw, 1.55rem);
      line-height: 1.75; color: var(--ink); font-weight: 500;
      overflow: hidden;
    }
    .chat-text .reveal { opacity: 0; }
    .chat-text .reveal.show { animation: charFade 0.5s ease forwards; }
    @keyframes charFade { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: blur(0); } }

    /* 扫光效果 */
    .chat-text::after {
      content: "";
      position: absolute; top: 0; left: -60%;
      width: 50%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.85), transparent);
      transform: skewX(-18deg);
      opacity: 0;
    }
    .chat-text.shine::after { animation: sweep 1.1s ease 0.1s 1; }
    @keyframes sweep {
      0%   { left: -60%; opacity: 0; }
      20%  { opacity: 1; }
      100% { left: 120%; opacity: 0; }
    }

    .chat-text strong { color: var(--blue-strong); font-weight: 700; }

    /* 底部蓝色区域 */
    .chat-footer {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 1rem 1.4rem;
      background: linear-gradient(90deg, #7fb4ff 0%, #9dc5ff 100%);
      color: #fff;
    }
    .chat-footer svg { width: 20px; height: 20px; stroke-width: 2; opacity: 0.9; }
    .chat-input { flex: 1; font-size: 0.95rem; color: rgba(255,255,255,0.92); }
    .chat-send {
      display: grid; place-items: center;
      width: 34px; height: 34px; border-radius: 50%;
      background: #fff; color: var(--blue-strong);
      box-shadow: 0 4px 12px rgba(10,16,26,0.18);
    }
    .chat-send svg { width: 16px; height: 16px; stroke-width: 2.4; transform: translateX(1px); }

    .hook-label {
      position: absolute; bottom: 4vh; left: 4vw; z-index: 3;
      font-size: 0.82rem; color: rgba(255,255,255,0.92);
      letter-spacing: 0.12em; text-shadow: 0 1px 6px rgba(0,0,0,0.35);
    }

    @media (max-width: 900px) {
      .hook-chat { width: 90vw; right: 5vw; left: 5vw; top: auto; bottom: 6vh; transform: translateY(0) scale(0.6); }
      .hook-chat.pop { animation: popInM 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards, jitterM 0.12s ease-in-out 0.95s 4; }
      .hook-chat.rest { transform: translateY(0) scale(1); }
      @keyframes popInM { 0%{opacity:0;transform:translateY(0) scale(0.6);} 70%{opacity:1;transform:translateY(0) scale(1.06);} 100%{opacity:1;transform:translateY(0) scale(1);} }
      @keyframes jitterM { 0%{transform:translateY(0) rotate(-1.4deg);} 50%{transform:translateY(0) rotate(1.4deg);} 100%{transform:translateY(0) rotate(0);} }
      .chat-body { padding: 1.6rem; }
    }
  </style>
</head>

          <div class="chat-name">小晓</div>
          <div class="chat-role">大四 · 非技术专业</div>
        </div>
      </div>
      <p class="chat-text" id="chatText">
        “我想做一个<strong>帮助小白进入陌生领域的手机网站</strong>，但我不知道该从哪开始。有没有人能帮我实现它？”
      </p>
    </div>

    <div class="chat-footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
      <div class="chat-input">输入你的回复，帮小晓实现这个想法…</div>
      <div class="chat-send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </div>
    </div>
  </div>

  <div class="hook-label">有人提出了一个真实需求。你会怎么回应？</div>

  <script>
    const panel = document.getElementById('chatPanel');
    const textEl = document.getElementById('chatText');

    // 把文字拆成单字 span，便于逐字浮现
    const raw = textEl.innerHTML;
    textEl.innerHTML = '';
    // 简单按字符拆分（保留 <strong> 标签结构）
    const tmp = document.createElement('div');
    tmp.innerHTML = raw;
    function walk(node, target) {
      node.childNodes.forEach(n => {
        if (n.nodeType === 3) {
          n.textContent.split('').forEach(ch => {
            const s = document.createElement('span');
            s.className = 'reveal'; s.textContent = ch;
            target.appendChild(s);
          });
        } else if (n.nodeType === 1) {
          const tag = document.createElement(n.tagName);
          tag.className = 'reveal';
          walk(n, tag);
          target.appendChild(tag);
        }
      });
    }
    walk(tmp, textEl);
    const chars = textEl.querySelectorAll('.reveal');

    window.addEventListener('load', () => {
      // 1. 弹入 + 抖两下
      panel.classList.add('pop');
      // 抖动结束后，转为静止保持态
      setTimeout(() => panel.classList.add('rest'), 1500);

      // 2. 窗口稳定后，文字逐字浮现 + 扫光
      setTimeout(() => {
        textEl.classList.add('shine');
        chars.forEach((c, i) => {
          setTimeout(() => c.classList.add('show'), i * 55);
        });
      }, 1700);
    });
  </script>
  <script>/* A2 幻灯片导航脚本
 * 键盘：F 全屏 | ← / → 切换页面 | 1-9 跳转到对应页 | R 重置动画 | Space 触发当前页动画
 * 需在每页 body 上添加 data-slide 属性，值为当前页序号（从 0 开始）
 */

(function () {
  const slides = [
    'A2-S0.html',
    'A2-S2.html',
    'A2-S3.html',
    'A2-S4.html',
    'A2-S5.html',
    'A2-S6.html',
    'A2-S7.html',
    'A2-S8.html',
    'A2-S9.html',
    'A2-S10.html',
  ];

  const currentFile = window.location.pathname.split('/').pop() || slides[0];
  let currentIndex = slides.indexOf(currentFile);
  if (currentIndex === -1) currentIndex = 0;

  function go(index) {
    if (index < 0 || index >= slides.length) return;
    window.location.href = slides[index];
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  function resetAnimations() {
    document.querySelectorAll('.visible').forEach((el) => {
      el.classList.remove('visible');
      void el.offsetWidth;
      el.classList.add('visible');
    });
  }

  function triggerAnimations() {
    document.querySelectorAll('[data-animate]').forEach((el) => {
      const delay = parseFloat(el.dataset.animate) || 0;
      setTimeout(() => el.classList.add('visible'), delay * 1000);
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    switch (e.key) {
      case 'ArrowRight':
      case 'PageDown':
      case ' ': // Space 下一页
        e.preventDefault();
        go(currentIndex + 1);
        break;
      case 'ArrowLeft':
      case 'PageUp':
        e.preventDefault();
        go(currentIndex - 1);
        break;
      case 'f':
      case 'F':
        e.preventDefault();
        toggleFullscreen();
        break;
      case 'r':
      case 'R':
        e.preventDefault();
        resetAnimations();
        break;
      case '1':
      case '2':
      case '3':
      case '4':
      case '5':
      case '6':
      case '7':
      case '8':
      case '9':
        e.preventDefault();
        const target = parseInt(e.key, 10) - 1;
        go(target);
        break;
    }
  });

  // —— 远程控制（教师端 → 大屏）——
  // 同机同源：BroadcastChannel('a2-screen')；也兼容 window.postMessage。
  // 指令：{action:'next'|'prev'|'step'|'goto'|'reset'}
  //   当前屏可注册 window.__screenStep(dir) 消费指令（返回 true 表示“本屏内部消化，不要翻页”）。
  function remoteNext() {
    const consumed = typeof window.__screenStep === 'function' && window.__screenStep(1);
    if (!consumed) go(currentIndex + 1);
  }
  function remotePrev() {
    const consumed = typeof window.__screenStep === 'function' && window.__screenStep(-1);
    if (!consumed) go(currentIndex - 1);
  }
  function handleRemote(d) {
    if (!d || !d.action) return;
    switch (d.action) {
      case 'next': remoteNext(); break;
      case 'prev': remotePrev(); break;
      case 'step': if (window.__screenStep) window.__screenStep(d.dir === -1 ? -1 : 1); break;
      case 'goto': if (typeof d.index === 'number') go(d.index); break;
      case 'reset': location.reload(); break;
    }
  }
  try {
    const bc = new BroadcastChannel('a2-screen');
    bc.onmessage = (e) => handleRemote(e.data);
  } catch (_) {}
  window.addEventListener('message', (e) => handleRemote(e.data));

  // 页面加载后自动触发带 data-animate 的元素
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', triggerAnimations);
  } else {
    triggerAnimations();
  }
})();
</script>
