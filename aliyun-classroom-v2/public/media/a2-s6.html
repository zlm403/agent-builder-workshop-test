    .overall-shade {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(90deg,
          rgba(3, 8, 16, 0.72) 0%,
          rgba(3, 8, 16, 0.32) 38%,
          rgba(3, 8, 16, 0.08) 60%,
          rgba(3, 8, 16, 0.28) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.06) 42%, rgba(0, 0, 0, 0.44));
    }

    .topbar {
      position: absolute;
      top: clamp(22px, 3vh, 40px);
      left: clamp(30px, 3.4vw, 64px);
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(231, 239, 255, 0.72);
      font-size: clamp(13px, 0.9vw, 17px);
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    .topbar::before {
      width: 9px; height: 9px; border-radius: 50%;
      background: #65e6ba;
      box-shadow: 0 0 20px rgba(101, 230, 186, 0.8);
      content: "";
    }

    .progress {
      position: absolute;
      top: clamp(22px, 3vh, 40px);
      right: clamp(30px, 3.4vw, 64px);
      z-index: 4;
      color: rgba(219, 230, 252, 0.5);
      font-size: clamp(12px, 0.8vw, 15px);
      letter-spacing: 0.08em;
    }

    /* ===== 对话气泡：分别定位在两人头顶上方 ===== */

    /* 左边男生（画面左侧约 18%，气泡在头顶上方） */
    .bubble-left {
      position: absolute;
      left: clamp(6%, 7vw, 120px);
      top: clamp(6%, 9vh, 80px);
      z-index: 5;
      max-width: min(36vw, 420px);
      opacity: 0;
      animation: floatIn 0.55s both;
    }

    /* 右边女生（画面右侧约 68%，气泡在头顶上方） */
    .bubble-right {
      position: absolute;
      right: clamp(6%, 7vw, 120px);
      top: clamp(10%, 13vh, 120px);
      z-index: 5;
      max-width: min(36vw, 420px);
      opacity: 0;
      animation: floatIn 0.55s both;
    }

    .bubble {
      position: relative;
      padding: clamp(13px, 1.4vw, 20px) clamp(15px, 1.6vw, 24px);
      border: 1px solid var(--bubble-line);
      border-radius: 20px;
      background: var(--bubble-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        0 14px 38px rgba(0, 0, 0, 0.34),
        0 2px 8px rgba(0, 0, 0, 0.14);
    }

    .bubble p {
      margin: 0;
      color: var(--white);
      font-size: clamp(15px, 1.15vw, 21px);
      line-height: 1.52;
    }

    .bubble p .hl { color: #9fe9c8; font-weight: 700; }
    .bubble p .em { color: #ffd98a; font-weight: 700; }

    /* 左气泡尖角：指向右下方（男生头顶） */
    .bubble-left .bubble::after {
      position: absolute;
      bottom: -9px;
      right: 28px;
      width: 0; height: 0;
      border: 9px solid transparent;
      border-top-color: var(--bubble-bg);
      border-bottom: 0;
      border-right: 0;
      content: "";
      filter: drop-shadow(3px 3px 3px rgba(0, 0, 0, 0.18));
    }

    .bubble-left .bubble::before {
      position: absolute;
      bottom: -11px;
      right: 25px;
      width: 0; height: 0;
      border: 11px solid transparent;
      border-top-color: var(--bubble-line);
      border-bottom: 0;
      border-right: 0;
      content: "";
      clip-path: polygon(0 0, 100% 0, 100% 45%, 50% 45%, 0 100%);
    }

    /* 右气泡尖角：指向左下方（女生头顶） */
    .bubble-right .bubble::after {
      position: absolute;
      bottom: -9px;
      left: 28px;
      width: 0; height: 0;
      border: 9px solid transparent;
      border-top-color: var(--bubble-bg);
      border-bottom: 0;
      border-left: 0;
      content: "";
      filter: drop-shadow(-3px 3px 3px rgba(0, 0, 0, 0.18));
    }

    .bubble-right .bubble::before {
      position: absolute;
      bottom: -11px;
      left: 25px;
      width: 0; height: 0;
      border: 11px solid transparent;
      border-top-color: var(--bubble-line);
      border-bottom: 0;
      border-left: 0;
      content: "";
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 55%, 0 55%);
    }

    /* 底部收束 */
    .caption {
      position: absolute;
      left: 0; right: 0;
      bottom: clamp(24px, 3.6vh, 48px);
      z-index: 5;
      text-align: center;
      padding: 0 clamp(20px, 4vw, 60px);
      opacity: 0;
      animation: floatIn 0.55s both;
    }

    .caption span {
      display: inline-block;
      padding: clamp(10px, 1.2vh, 16px) clamp(18px, 2.2vw, 34px);
      border: 1px solid rgba(124, 168, 255, 0.22);
      border-radius: 999px;
      background: rgba(8, 16, 32, 0.54);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(231, 239, 255, 0.92);
      font-size: clamp(14px, 1.08vw, 19px);
      line-height: 1.5;
    }

    .caption b { color: #cfe0ff; font-weight: 700; }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .bubble-left { left: 4%; max-width: 44vw; }
      .bubble-right { right: 4%; max-width: 44vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bubble-left, .bubble-right, .caption { animation: none; opacity: 1; }
    }
  </style>
</head>

<body data-slide="6">
  <main class="screen">
    <div class="background"></div>
    <div class="overall-shade"></div>

    <div class="topbar">A2 · AI 团队自动执行</div>
    <div class="progress">06 / 12</div>

    <!-- 左边男生：聊想法 -->
    <div class="bubble-left" style="animation-delay: 0.2s">
      <div class="bubble">
        <p>我有个想法——<span class="hl">让 AI 自己开会</span>，把活分好，他们自己干完。</p>
      </div>
    </div>

    <!-- 右边女生：接话、聊感觉 -->
    <div class="bubble-right" style="animation-delay: 0.6s">
      <div class="bubble">
        <p>对！而且他们还能<span class="em">自己检测</span>、自己改 —— 咱就喝咖啡呗。</p>
      </div>
    </div>

    <!-- 底部收束 -->
    <div class="caption" style="animation-delay: 1s">
      <span><b>创意是最好的。</b> 你把想法说清楚，剩下的他们自己跑。</span>
    </div>
  </main>

  <script>/* A2 幻灯片导航脚本
 * 键盘：F 全屏 | ← / → 切换页面 | 1-9 跳转到对应页 | R 重置动画 | Space 触发当前页动画
 * 需在每页 body 上添加 data-slide 属性，值为当前页序号（从 0 开始）
 */

(function () {
  const slides = [
    'A2-S0.html',
    'A2-S2.html',
    'A2-S3.html',
    'A2-S4.html',
    'A2-S5.html',
    'A2-S6.html',
    'A2-S7.html',
    'A2-S8.html',
    'A2-S9.html',
    'A2-S10.html',
  ];

  const currentFile = window.location.pathname.split('/').pop() || slides[0];
  let currentIndex = slides.indexOf(currentFile);
  if (currentIndex === -1) currentIndex = 0;

  function go(index) {
    if (index < 0 || index >= slides.length) return;
    window.location.href = slides[index];
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  function resetAnimations() {
    document.querySelectorAll('.visible').forEach((el) => {
      el.classList.remove('visible');
      void el.offsetWidth;
      el.classList.add('visible');
    });
  }

  function triggerAnimations() {
    document.querySelectorAll('[data-animate]').forEach((el) => {
      const delay = parseFloat(el.dataset.animate) || 0;
      setTimeout(() => el.classList.add('visible'), delay * 1000);
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    switch (e.key) {
      case 'ArrowRight':
      case 'PageDown':
      case ' ': // Space 下一页
        e.preventDefault();
        go(currentIndex + 1);
        break;
      case 'ArrowLeft':
      case 'PageUp':
        e.preventDefault();
        go(currentIndex - 1);
        break;
      case 'f':
      case 'F':
        e.preventDefault();
        toggleFullscreen();
        break;
      case 'r':
      case 'R':
        e.preventDefault();
        resetAnimations();
        break;
      case '1':
      case '2':
      case '3':
      case '4':
      case '5':
      case '6':
      case '7':
      case '8':
      case '9':
        e.preventDefault();
        const target = parseInt(e.key, 10) - 1;
        go(target);
        break;
    }
  });

  // —— 远程控制（教师端 → 大屏）——
  // 同机同源：BroadcastChannel('a2-screen')；也兼容 window.postMessage。
  // 指令：{action:'next'|'prev'|'step'|'goto'|'reset'}
  //   当前屏可注册 window.__screenStep(dir) 消费指令（返回 true 表示“本屏内部消化，不要翻页”）。
  function remoteNext() {
    const consumed = typeof window.__screenStep === 'function' && window.__screenStep(1);
    if (!consumed) go(currentIndex + 1);
  }
  function remotePrev() {
    const consumed = typeof window.__screenStep === 'function' && window.__screenStep(-1);
    if (!consumed) go(currentIndex - 1);
  }
  function handleRemote(d) {
    if (!d || !d.action) return;
    switch (d.action) {
      case 'next': remoteNext(); break;
      case 'prev': remotePrev(); break;
      case 'step': if (window.__screenStep) window.__screenStep(d.dir === -1 ? -1 : 1); break;
      case 'goto': if (typeof d.index === 'number') go(d.index); break;
      case 'reset': location.reload(); break;
    }
  }
  try {
    const bc = new BroadcastChannel('a2-screen');
    bc.onmessage = (e) => handleRemote(e.data);
  } catch (_) {}
  window.addEventListener('message', (e) => handleRemote(e.data));

  // 页面加载后自动触发带 data-animate 的元素
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', triggerAnimations);
  } else {
    triggerAnimations();
  }
})();
</script>
</body>
</html>
