<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理AI的提问</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1322;color:#f5f3ff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
.page{height:100vh;padding:6vh 6vw;display:grid;grid-template-columns:.72fr 1.28fr;gap:6vw;align-items:center}
.tag{color:#66e3b4;font-weight:800;letter-spacing:.14em;font-size:clamp(14px,1.2vw,21px)}
h1{font-size:clamp(43px,4.7vw,83px);line-height:1.15;margin:2vh 0}
.lead{font-size:clamp(18px,1.5vw,26px);line-height:1.7;color:#94a4be}
.warn{margin-top:4vh;color:#d8cdfc;font-size:clamp(16px,1.3vw,22px);line-height:1.6;border-left:4px solid #7964e9;padding-left:20px}
.rules{display:flex;flex-direction:column;gap:20px}
.rule{border:1px solid #2c3d59;background:#101b2e;border-radius:25px;padding:2vw 2.3vw;display:grid;grid-template-columns:62px 1fr;gap:20px}
.n{width:55px;height:55px;border-radius:16px;background:#192b48;display:grid;place-items:center;color:#8db7ed;font-size:21px;font-weight:900}
.rule:nth-child(2){border-color:#554a82}
.rule:nth-child(2) .n{background:#392f72;color:#d4c9ff}
.rule h2{font-size:clamp(22px,2vw,35px);margin:0 0 12px}
.rule p{color:#97a7c0;font-size:clamp(15px,1.22vw,20px);line-height:1.65;margin:0}
.say{color:#d1c8ec}
.key{color:#66e3b4}
</style>
</head>
<body>
<main class="page">
  <section>
    <div class="tag">MANAGE THE INTERVIEW · 管理提问</div>

    <h1>
      不是每个问题<br>
      都要回答
    </h1>

    <p class="lead">
      AI也会跑偏。<br>
      顺着回答，只会越聊越远。
    </p>

    <div class="warn">
      跑偏的问题，不回答。<br>
      不清楚的问题，先问为什么。
    </div>
  </section>

  <section class="rules">
    <article class="rule">
      <div class="n">01</div>
      <div>
        <h2>跑偏了，直接叫停</h2>
        <p class="say">
          “这个问题和目标无关，请回到朋友圈数字分身。”
        </p>
      </div>
    </article>

    <article class="rule">
      <div class="n">02</div>
      <div>
        <h2>回答前，先问目的</h2>
        <p class="say">
          “你为什么问这个？它和我们的目标有什么关系？”
        </p>
      </div>
    </article>

    <article class="rule">
      <div class="n">03</div>
      <div>
        <h2>回答后，检查理解</h2>
        <p class="say">
          “请复述你从我的回答中理解到了什么。”
        </p>
      </div>
    </article>
  </section>
</main>
</body>
</html>
