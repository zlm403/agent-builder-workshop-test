<!doctype html>
<html lang="zh-CN">
<head>
<style>
html, body { width: 100%; height: 100%; margin: 0; background: #0b1220; }
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共同确定方法</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1322;color:#f6f3ff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
.page{height:100vh;padding:6vh 6vw;display:flex;flex-direction:column}
.tag{color:#66e3b4;font-weight:800;letter-spacing:.14em;font-size:clamp(14px,1.2vw,21px)}
h1{font-size:clamp(40px,4.5vw,80px);margin:2vh 0 .8vh}
.sub{color:#8496b3;font-size:clamp(17px,1.45vw,25px)}
.gates{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;align-items:center}
.card{height:min(39vh,360px);border:1px solid #2b3d59;background:#101b2e;border-radius:27px;padding:2.5vw 2.2vw;display:flex;flex-direction:column}
.ico{width:55px;height:55px;border-radius:16px;background:#192b48;color:#8db7ed;display:grid;place-items:center;font-size:23px;font-weight:900}
.card:nth-child(2){border-color:#52487e}
.card:nth-child(2) .ico{background:#382e70;color:#d2c6ff}
.name{font-size:clamp(24px,2.25vw,39px);font-weight:900;margin:3vh 0 1.4vh}
.desc{color:#96a6bf;font-size:clamp(15px,1.25vw,21px);line-height:1.65}
.foot{text-align:center;color:#aca0d1;font-size:clamp(17px,1.45vw,25px)}
.foot b{color:#66e3b4}
</style>
</head>
<body>
<main class="page">
  <div class="tag">DECIDE HOW · 确定怎么做</div>

  <h1>确定方法，也要先过三关</h1>
  <div class="sub">
    别只用自己的第一个想法，也别直接接受AI的第一个答案。
  </div>

  <section class="gates">
    <article class="card">
      <div class="ico">01</div>
      <div class="name">一起商量</div>
      <div class="desc">
        我说已有想法，AI帮我补充和改进。
      </div>
    </article>

    <article class="card">
      <div class="ico">02</div>
      <div class="name">说清限制</div>
      <div class="desc">
        把自己的时间、能力、工具和资料告诉AI。
      </div>
    </article>

    <article class="card">
      <div class="ico">03</div>
      <div class="name">反复调整</div>
      <div class="desc">
        不合适就继续修改，直到这个方法真的能做。
      </div>
    </article>
  </section>

  <div class="foot">
    好的方法，是人与AI<b>共同商量</b>出来的。
  </div>
</main>
</body>
</html>
