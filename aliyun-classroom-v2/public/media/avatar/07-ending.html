<!doctype html>
<html lang="zh-CN">
<head>
<style>
html, body { width: 100%; height: 100%; margin: 0; background: #0b1220; }
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI时代的沟通方式</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1322;color:#f6f3ff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
.page{height:100vh;padding:6vh 6vw;display:flex;flex-direction:column}
.tag{color:#66e3b4;font-weight:800;letter-spacing:.14em;font-size:clamp(14px,1.2vw,21px)}
.main{flex:1;display:grid;grid-template-columns:.82fr 1.18fr;gap:6vw;align-items:center}
h1{font-size:clamp(41px,4.5vw,79px);line-height:1.18;margin:2vh 0}
.lead{color:#91a2bd;font-size:clamp(17px,1.45vw,25px);line-height:1.7}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:1.5vw}
.card{min-height:285px;border:1px solid #2b3d59;background:#101b2e;border-radius:26px;padding:2.3vw;display:flex;flex-direction:column}
.card.ai{border-color:#6654bd;background:#151e36}
.label{color:#7d91b2;font-size:14px;font-weight:900;letter-spacing:.12em}
.card.ai .label{color:#aa9bf1}
.card h2{font-size:clamp(24px,2.2vw,38px);margin:24px 0 14px}
.card p{color:#97a7c0;font-size:clamp(15px,1.2vw,20px);line-height:1.7;margin:0}
.question{border-top:1px solid #26364f;padding-top:2.7vh;display:flex;justify-content:space-between;align-items:center;gap:4vw}
.question span{color:#788ba9;font-size:clamp(14px,1.15vw,20px)}
.question strong{color:#d9caff;font-size:clamp(19px,1.8vw,31px);text-align:right;line-height:1.45}
.question b{color:#66e3b4}
</style>
</head>
<body>
<main class="page">
  <div class="tag">
    A NEW WAY TO COMMUNICATE · AI时代的沟通方式
  </div>

  <section class="main">
    <div>
      <h1>
        和AI沟通，<br>
        有点像和<br>
        “外星人”沟通
      </h1>

      <p class="lead">
        它知道很多，<br>
        但不一定像我们一样理解。
      </p>
    </div>

    <div class="compare">
      <article class="card">
        <div class="label">人与人</div>
        <h2>拥有共同基础</h2>
        <p>我们共享很多经验、知识和语境。</p>
      </article>

      <article class="card ai">
        <div class="label">人与AI</div>
        <h2>需要主动对齐</h2>
        <p>
          共同确定目标，验证理解，商量方法，随时纠偏。
        </p>
      </article>
    </div>
  </section>

  <footer class="question">
    <span>我们已经学会怎样和AI沟通。接下来——</span>

    <strong>
      先全部学会，再开始？<br>
      还是<b>现在就开始，在行动中学会？</b>
    </strong>
  </footer>
</main>
</body>
</html>
