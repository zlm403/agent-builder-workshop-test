<!doctype html>
<html lang="zh-CN">
<head>
<style>
html, body { width: 100%; height: 100%; margin: 0; background: #0b1220; }
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>结尾与下一任务</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1322;color:#f6f3ff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
.page{height:100vh;padding:6vh 6vw;display:flex;flex-direction:column}
.tag{color:#66e3b4;font-weight:800;letter-spacing:.14em;font-size:clamp(14px,1.2vw,21px)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.small{color:#8193b0;font-size:clamp(18px,1.6vw,28px);margin-bottom:3vh}
.question{font-size:clamp(41px,5.2vw,92px);font-weight:900;line-height:1.28;letter-spacing:-.035em}
.old{color:#7789a7}
.or{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border:1px solid #3e5270;border-radius:50%;font-size:.35em;color:#889ab7;vertical-align:.35em;margin:0 .45em}
.now{color:#d9caff;position:relative}
.now:after{content:"";position:absolute;left:3%;right:3%;bottom:-10px;height:5px;border-radius:4px;background:#66e3b4}
.next{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #26364f;padding-top:2.5vh;color:#7f91ae;font-size:clamp(14px,1.15vw,20px)}
.next strong{color:#c9c0e6;font-weight:700}
</style>
</head>
<body>
<main class="page">
  <div class="tag">ONE LAST QUESTION · 最后一个问题</div>

  <section class="center">
    <div class="small">面对一个充满未知的新世界</div>

    <div class="question">
      <span class="old">先学会，再开始</span>
      <span class="or">还是</span>
      <br>
      <span class="now">现在就开始，在行动中学会？</span>
    </div>
  </section>

  <footer class="next">
    <span>你不需要先成为专家，才有资格行动。</span>
    <strong>下一次：让“数字的你”变得更像你 →</strong>
  </footer>
</main>
</body>
</html>
