<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>顷悟课堂 · 大屏</title>
<style>
:root{--bg:#070b16;--panel:#0e1730;--panel2:#13203f;--line:#26324d;--txt:#e8eefc;--sub:#9fb0d0;--green:#22c55e;--blue:#38bdf8;--orange:#fb923c}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;min-height:100vh;display:flex;flex-direction:column}
header{padding:16px 28px;display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#14223f,#070b16)}
header .logo{font-size:26px;font-weight:800;letter-spacing:2px}
header .logo b{color:var(--blue)}
header .cur{color:var(--sub);font-size:15px;margin-left:auto}
.screen{flex:1;display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden}
/* 内容块显示 */
.blk-title{font-size:22px;font-weight:800;margin-bottom:16px;color:var(--sub)}
.blk-text{font-size:48px;font-weight:900;line-height:1.5;text-align:center;max-width:80vw}
.blk-img{max-width:85vw;max-height:78vh;border-radius:14px;border:1px solid var(--line)}
.blk-task{width:78vw}
.blk-task .t{font-size:34px;font-weight:900;margin-bottom:12px}
.blk-task .s{font-size:24px;line-height:1.8;color:var(--txt);white-space:pre-line}
.blk-task .p{font-size:20px;line-height:1.7;color:var(--sub);white-space:pre-line;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.blk-frame{width:92vw;height:82vh;border:none;border-radius:12px;background:#fff}
.empty{color:var(--sub);font-size:26px}
.foot{padding:10px 28px;color:var(--sub);font-size:12px}
</style>
</head>
<body>
<header>
  <span class="logo">顷悟·<b>课堂</b></span>
  <span class="cur" id="curLesson">课堂进行中</span>
</header>

<div class="screen" id="screen"><div class="empty">等待老师投屏内容…</div></div>

<div class="foot" id="foot">顷悟教学监控 · 大屏 · 数据实时刷新</div>

<script>
const $ = s => document.querySelector(s);
let lastActive = null;
let lastBlockStr = '';

function renderBlock(b){
  const screen = $('#screen');
  if (!b) { screen.innerHTML = '<div class="empty">等待老师投屏内容…</div>'; return; }
  const title = b.title ? `<div class="blk-title">${esc(b.title)}</div>` : '';
  if (b.type === 'text') {
    screen.innerHTML = title + `<div class="blk-text">${esc(b.content).replace(/\n/g,'<br>')}</div>`;
  } else if (b.type === 'image') {
    screen.innerHTML = title + `<img class="blk-img" src="${esc(b.content)}" alt="${esc(b.title)}">`;
  } else if (b.type === 'video') {
    screen.innerHTML = title + `<video class="blk-img" controls autoplay src="${esc(b.content)}"></video>`;
  } else if (b.type === 'page') {
    screen.innerHTML = `<iframe class="blk-frame" src="${esc(b.content)}"></iframe>`;
  } else if (b.type === 'task') {
    screen.innerHTML = `<div class="blk-task">
      <div class="t">${esc(b.content.title || b.title || '课堂任务')}</div>
      ${b.content.steps ? `<div class="s">📌 步骤：\n${esc(b.content.steps)}</div>` : ''}
      ${b.content.points ? `<div class="p">💡 注意：\n${esc(b.content.points)}</div>` : ''}
    </div>`;
  } else {
    screen.innerHTML = title + `<div class="blk-text">${esc(b.content)}</div>`;
  }
}

async function refresh(){
  try {
    const r = await fetch('/api/screen', { cache: 'no-store' });
    const d = await r.json();
    const activeId = d.activeId;
    // 课程名
    try {
      const lr = await fetch('/api/lesson', { cache: 'no-store' });
      const ld = await lr.json();
      const cur = ld.currentLesson;
      $('#curLesson').textContent = cur ? ('当前课程：' + cur) : '课堂进行中';
    } catch(e){}
    if (!activeId) {
      if (lastActive !== null) { $('#screen').innerHTML = '<div class="empty">等待老师投屏内容…</div>'; lastActive = null; }
      return;
    }
    if (activeId === lastActive) return;   // 没变，不刷新
    lastActive = activeId;
    const blk = d.blocks.find(x => x.id === activeId);
    renderBlock(blk || null);
  } catch(e){}
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
