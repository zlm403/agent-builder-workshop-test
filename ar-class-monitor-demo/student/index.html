<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂工作台 · 学生端</title>
<link rel="stylesheet" href="styles.css?v=20260212">
</head>
<body>
<div class="app">

  <header>
    <h1>🎯 课堂工作台 <em>学生端</em></h1>
    <div class="head-right" id="sidForm">
      <input id="sidNo" class="sid sidno" placeholder="上课号（向老师领取）" maxlength="20" autocomplete="off">
      <button id="btnSidSubmit" class="ghost" type="button">签到</button>
      <button id="btnReset" class="ghost reset-btn" type="button" title="退出签到状态，重新开始">退出重来</button>
      <span class="hint sid-hint" id="sidHint"></span>
    </div>
  </header>

  <!-- 项目切换 -->
  <nav class="courses" id="courseNav">
    <button class="course on" data-course="1" type="button">🎮 项目一 · 接金币游戏</button>
    <button class="course" data-course="2" type="button">🔋 项目二 · 心情电量</button>
    <button class="course" data-course="4" type="button">🤖 项目三 · 内心戏</button>
  </nav>

  <!-- 任务看板（含本课引导，合二为一） -->
  <section class="pane">
    <div class="pane-title">📋 任务看板 <span class="dim" id="taskCourseTag"></span></div>
    <div class="taskcard" id="taskCard">
      <div class="task-empty">🔒 还没开始<br><span class="dim">等老师推进后，这里会显示你要做什么。</span></div>
    </div>
    <div class="row">
      <button id="btnTaskOk" class="primary" disabled hidden>✓ 知道了，开始做</button>
      <span class="hint" id="taskHint"></span>
    </div>
    <div class="guide-in-task">
      <div class="guide-title">🧭 这节课怎么学 <span class="dim" id="guideCourse"></span></div>
      <ol class="guide" id="guideList"></ol>
    </div>
  </section>

  <!-- 和老师聊（独立消息框，老师回复实时显示） -->
  <section class="pane" id="chatPane">
    <div class="pane-title">💬 和老师聊 <span class="dim" id="chatTitle">（有问题直接说，老师回复会出现在这里）</span></div>
    <div class="chat-log" id="chatLog"><div class="chat-empty">还没有消息，遇到问题就发一条吧</div></div>
    <div class="row ask-row">
      <input id="askInput" class="ask-input" placeholder="遇到问题打出来，比如：AI 不按我说的做…" maxlength="200">
      <button id="btnAsk" class="ghost" type="button">发送</button>
    </div>
    <span class="hint" id="askHint"></span>
  </section>

  <!-- 我的学习水位（六大知识点：水满=学得好） -->
  <section class="pane">
    <div class="pane-title">💧 我的学习水位 <span class="dim" id="mirrorCourse">（6 块知识，水满了就说明这块学会了）</span></div>
    <div id="mirrorBody">
      <div class="mirror-empty">📝 你开始动手后，这里会显示你在 6 块知识上各学到哪了——<br><span class="dim">哪块水满了（学会了），哪块还是浅的（还要练）。</span></div>
    </div>
  </section>

  <div class="tip">🗨 与 AI 的对话请到 <b>顷悟 APP</b> 打开本课应用进行。你在本页的所有操作都会自动同步到老师端。</div>
</div>

<script src="../lib/track.js?v=20260212"></script>
<script src="../lib/analyze.js?v=20260212"></script>
<script src="app.js?v=20260212"></script>
</body>
</html>
