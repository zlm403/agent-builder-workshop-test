<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎬 视频抓取小工具</title>
<style>
  :root {
    --bg: #0c0e12; --panel: #151922; --panel2: #1b2130; --border: #2a3242;
    --text: #e8edf4; --muted: #93a0b4; --accent: #3b82f6; --accent2: #60a5fa;
    --ok: #34d399; --warn: #fbbf24; --fail: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    font-size: 18px; line-height: 1.5;
    max-width: 1180px; margin: 0 auto; padding: 28px 22px 80px;
  }
  h1 { font-size: 32px; }
  h2 { font-size: 24px; margin: 34px 0 14px; display: flex; align-items: baseline; gap: 10px; }
  .sub { color: var(--muted); margin: 6px 0 18px; font-size: 16px; }
  .muted { color: var(--muted); font-size: 16px; font-weight: 400; }
  .hidden { display: none !important; }

  .fetch-row { display: flex; gap: 12px; }
  #urlInput {
    flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 14px 16px; font-size: 18px; outline: none;
  }
  #urlInput:focus { border-color: var(--accent); }
  #btnFetch {
    background: var(--accent); border: none; border-radius: 10px; color: #fff;
    font-size: 18px; font-weight: 600; padding: 0 26px; cursor: pointer; transition: filter .15s;
  }
  #btnFetch:hover { filter: brightness(1.1); }
  #btnFetch:active { transform: translateY(1px); }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #1e293b; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 22px; font-size: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 99;
  }

  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; }
  .task-head { display: flex; align-items: center; gap: 12px; }
  .tag { flex: none; font-size: 14px; border-radius: 6px; padding: 2px 10px; background: var(--panel2); color: var(--muted); }
  .task.downloading .tag { background: rgba(59,130,246,.15); color: var(--accent2); }
  .task.done .tag { background: rgba(52,211,153,.15); color: var(--ok); }
  .task.failed .tag { background: rgba(248,113,113,.15); color: var(--fail); }
  .task-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-spd { flex: none; color: var(--muted); font-size: 15px; font-family: Consolas, monospace; }
  .bar { height: 8px; background: var(--panel2); border-radius: 5px; overflow: hidden; margin-top: 10px; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 5px; transition: width .3s; }
  .task-meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .task-err {
    color: var(--fail); font-size: 14px; margin-top: 8px; white-space: pre-wrap; word-break: break-all;
    background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); border-radius: 8px; padding: 8px 10px;
  }
  .empty { color: var(--muted); text-align: center; padding: 36px 0; border: 1px dashed var(--border); border-radius: 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s;
  }
  .card:hover { border-color: var(--accent); }
  .cover {
    position: relative; height: 140px; cursor: pointer;
    background: linear-gradient(135deg, #232a3a, #1a2130);
    display: flex; align-items: center; justify-content: center; user-select: none;
  }
  .cover::before { content: "🎞"; font-size: 44px; opacity: .55; }
  .dur {
    position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.65); color: #fff;
    font-size: 13px; border-radius: 6px; padding: 2px 8px; font-family: Consolas, monospace;
  }
  .card-title { padding: 12px 14px 4px; font-size: 17px; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card-size { padding: 0 14px; color: var(--muted); font-size: 14px; }
  .card-btns { display: flex; gap: 10px; padding: 12px 14px 14px; margin-top: auto; }
  .card-btns button { flex: 1; border: none; border-radius: 8px; padding: 10px 0; font-size: 16px; cursor: pointer; transition: filter .15s; }
  .btn-play { background: var(--accent); color: #fff; }
  .btn-del { background: #2b3346; color: var(--text); }
  .card-btns button:hover { filter: brightness(1.15); }

  .player-panel {
    position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: rgba(0,0,0,.94);
    z-index: 50; display: flex; flex-direction: column; padding: 14px 18px;
  }
  .player-bar { display: flex; align-items: center; justify-content: space-between; color: var(--text); font-size: 18px; padding: 4px 0 10px; gap: 10px; }
  .player-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .player-actions { display: flex; gap: 10px; flex: none; }
  .player-actions button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 16px; font-size: 16px; cursor: pointer;
  }
  .player-actions button:hover { border-color: var(--accent); }
  #player { flex: 1; width: 100%; min-height: 0; background: #000; outline: none; }
</style>
</head>
<body>

  <header>
    <h1>🎬 视频抓取小工具</h1>
    <p class="sub">粘贴短视频链接，下载高清原片保存到本地，随时点开即播。</p>
    <div class="fetch-row">
      <input id="urlInput" type="text" placeholder="粘贴视频链接，如 https://v.douyin.com/xxxxx/" autocomplete="off">
      <button id="btnFetch">⬇ 开始下载</button>
    </div>
    <div id="toast" class="toast hidden"></div>
  </header>

  <section id="tasksSection">
    <h2>📥 下载任务</h2>
    <div id="taskList" class="task-list"></div>
    <div id="taskEmpty" class="empty">暂无任务，粘贴链接开始下载吧</div>
  </section>

  <section id="videosSection">
    <h2>🎞 视频库 <span id="videoCount" class="muted"></span></h2>
    <div id="videoGrid" class="grid"></div>
    <div id="videoEmpty" class="empty">还没有视频，先粘贴链接下载一个吧</div>
  </section>

  <!-- 播放器（点击播放后出现在页面主区） -->
  <section id="playerSection" class="player-panel hidden">
    <div class="player-bar">
      <span id="playerTitle" class="player-title"></span>
      <span class="player-actions">
        <button id="btnFs">⛶ 全屏</button>
        <button id="btnClosePlayer">✕ 关闭</button>
      </span>
    </div>
    <video id="player" controls autoplay></video>
  </section>

<script>
'use strict';
const $ = (s) => document.querySelector(s);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtSize(b) {
  if (typeof b !== 'number' || !isFinite(b)) return '-';
  if (b < 1024) return b + ' B';
  const u = ['KB', 'MB', 'GB', 'TB'];
  let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
  return (b >= 100 ? Math.round(b) : b.toFixed(1)) + ' ' + u[i];
}

function fmtDur(s) {
  s = Math.round(s || 0);
  if (!s) return '--:--';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const mm = String(m).padStart(2, '0');
  const ss = String(sec).padStart(2, '0');
  return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 3000);
}

const STATUS_TAG = {
  queued: ['⏳ 排队中', ''],
  downloading: ['⏬ 下载中', 'downloading'],
  done: ['✅ 已完成', 'done'],
  failed: ['❌ 失败', 'failed']
};

// ---------- 任务区 ----------
function renderTasks(tasks) {
  const list = $('#taskList');
  const empty = $('#taskEmpty');
  if (!tasks.length) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  list.innerHTML = tasks.slice().reverse().map((t) => {
    const [label, cls] = STATUS_TAG[t.status] || [t.status, ''];
    const known = typeof t.progress === 'number' && t.progress >= 0;
    const pct = t.status === 'done' ? 100 : (known ? Math.min(100, Math.max(0, t.progress)) : 0);
    const showBar = t.status === 'queued' || t.status === 'downloading' || t.status === 'done';
    const spdHtml = (t.status === 'downloading' && t.speed) ? '<span class="task-spd">' + esc(t.speed) + '</span>' : '';
    const errHtml = t.error ? '<div class="task-err">' + esc(t.error) + '</div>' : '';
    const pctHtml = t.status === 'done' ? '100%'
      : (known ? pct + '%' : (t.status === 'failed' ? '' : '解析中…'));
    return '<div class="task ' + cls + '">'
      + '<div class="task-head"><span class="tag">' + label + '</span>'
      + '<span class="task-title" title="' + esc(t.url) + '">' + esc(t.title || t.url) + '</span>'
      + spdHtml + '</div>'
      + (showBar ? '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>'
        + (pctHtml ? '<div class="task-meta">' + pctHtml + '</div>' : '') : '')
      + errHtml
      + '</div>';
  }).join('');
}

// ---------- 视频库 ----------
function renderVideos(videos) {
  const grid = $('#videoGrid');
  const empty = $('#videoEmpty');
  const count = $('#videoCount');
  count.textContent = videos.length ? '（' + videos.length + ' 个）' : '';
  if (!videos.length) { grid.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  grid.innerHTML = videos.map((v) => {
    const enc = encodeURIComponent(v.filename);
    return '<div class="card" data-enc="' + enc + '" data-title="' + esc(v.title) + '">'
      + '<div class="cover" data-act="play"><span class="dur">' + fmtDur(v.durationSec) + '</span></div>'
      + '<div class="card-title" title="' + esc(v.title) + '">' + esc(v.title) + '</div>'
      + '<div class="card-size">' + fmtSize(v.size) + '</div>'
      + '<div class="card-btns">'
      + '<button class="btn-play" data-act="play">▶ 播放</button>'
      + '<button class="btn-del" data-act="del">🗑 删除</button>'
      + '</div>'
      + '</div>';
  }).join('');
  grid.onclick = async (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const card = el.closest('.card');
    if (!card) return;
    const fname = decodeURIComponent(card.dataset.enc);
    const title = card.dataset.title;
    if (el.dataset.act === 'play') playVideo(fname, title);
    else await delVideo(fname, title);
  };
}

function playVideo(fname, title) {
  const sec = $('#playerSection');
  sec.classList.remove('hidden');
  $('#playerTitle').textContent = '▶ ' + (title || fname);
  const v = $('#player');
  v.src = '/video/' + encodeURIComponent(fname);
  v.play().catch(() => {});
  sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function delVideo(fname, title) {
  if (!confirm('确定删除这个视频？\n' + (title || fname))) return;
  const r = await fetch('/api/videos/' + encodeURIComponent(fname), { method: 'DELETE' });
  const j = await r.json().catch(() => ({}));
  if (j.ok) {
    toast('已删除');
    closePlayerIfPlaying(fname);
    poll();
  } else {
    toast(j.error || '删除失败');
  }
}

function closePlayerIfPlaying(fname) {
  const v = $('#player');
  if (v.src && v.src.indexOf(encodeURIComponent(fname)) !== -1) {
    v.pause();
    v.removeAttribute('src');
    $('#playerSection').classList.add('hidden');
  }
}

$('#btnFs').addEventListener('click', () => {
  const v = $('#player');
  if (v.requestFullscreen) v.requestFullscreen();
  else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
});
$('#btnClosePlayer').addEventListener('click', () => {
  const v = $('#player');
  v.pause();
  v.removeAttribute('src');
  $('#playerSection').classList.add('hidden');
});

// ---------- 添加任务 ----------
async function submit() {
  const url = $('#urlInput').value.trim();
  if (!url) { toast('请先粘贴视频链接'); return; }
  const r = await fetch('/api/fetch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url })
  });
  const j = await r.json().catch(() => ({}));
  if (j.ok) {
    if (j.dup) toast('该链接已在下载或已在视频库中，无需重复下载');
    else { toast('已加入下载队列'); $('#urlInput').value = ''; }
  } else {
    toast(j.error || '添加失败');
  }
  poll();
}
$('#btnFetch').addEventListener('click', submit);
$('#urlInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

// ---------- 轮询 ----------
async function poll() {
  try {
    const r = await fetch('/api/state');
    const st = await r.json();
    renderTasks(st.tasks || []);
    renderVideos(st.videos || []);
  } catch (e) { /* 保留上一次渲染 */ }
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
